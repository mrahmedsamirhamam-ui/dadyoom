<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#123f39" />
  <title>ضاديوم — غير متصل</title>
  <style>
    body{margin:0;background:#fbf6ea;color:#123f39;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:24px}
    section{max-width:520px;background:white;border:1px solid #e0cfaa;border-radius:28px;padding:28px;text-align:center;box-shadow:0 18px 50px #00000012}
    h1{margin:0 0 12px;font-size:28px}
    p{line-height:1.9;color:#625b50}
    button{border:0;border-radius:16px;background:#123f39;color:white;font-weight:900;padding:12px 20px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <section>
      <h1>ضاديوم</h1>
      <p>لا يوجد اتصال بالإنترنت حاليًا. أعد الاتصال ثم جرّب مرة أخرى.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </section>
  </main>
</body>
</html>
