name: P0 isolated browser grant security rehearsal

on:
  push:
    branches: [fix/p0-ui-arabic-roles-grades-20261107]
  pull_request:
    paths:
      - 'scripts/security/proposed-*.sql'
      - 'tests/security/shadow-*.sql'
      - '.github/workflows/p0-shadow-grade-role-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-privileges:
    name: Deny unverified browser writes and private answer reads in disposable Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: disposable-ci-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_CONTAINER_ID: ${{ job.services.postgres.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create only disposable fixture roles and databases
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "CREATE ROLE anon NOLOGIN;" -c "CREATE ROLE authenticated NOLOGIN;"
          for db in shadow_question_privacy shadow_activity_privacy shadow_grading shadow_skill_rewards; do
            docker exec "$PG_CONTAINER_ID" createdb -U postgres "$db"
          done
      - name: Deny private question key in sandbox; allow approved lesson view
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_question_privacy < tests/security/shadow-question-key-cutover-setup.sql
          if out=$(docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_question_privacy < scripts/security/proposed-question-key-column-cutover.sql 2>&1); then
            echo "Candidate accepted absent rehearsal flag" >&2; exit 1
          fi
          echo "$out" | grep -q 'PRODUCTION_QUESTION_KEY_CUTOVER_BLOCKED'
          {
            echo "SET dadyoom.question_privacy_rehearsal='enabled';"
            cat scripts/security/proposed-question-key-column-cutover.sql
            cat tests/security/shadow-question-key-cutover-verify.sql
          } | docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_question_privacy
      - name: Deny private activity answer in sandbox; preserve published content
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_activity_privacy < tests/security/shadow-activity-answer-cutover-setup.sql
          if out=$(docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_activity_privacy < scripts/security/proposed-activity-answer-column-cutover.sql 2>&1); then
            echo "Candidate accepted absent rehearsal flag" >&2; exit 1
          fi
          echo "$out" | grep -q 'PRODUCTION_ACTIVITY_ANSWER_CUTOVER_BLOCKED'
          {
            echo "SET dadyoom.activity_privacy_rehearsal='enabled';"
            cat scripts/security/proposed-activity-answer-column-cutover.sql
            cat tests/security/shadow-activity-answer-cutover-verify.sql
          } | docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_activity_privacy
      - name: Rehearse fake earned-XP and daily bonus cutover without browser writes
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_skill_rewards < tests/security/shadow-skill-daily-rewards-setup.sql
          if out=$(docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_skill_rewards < scripts/security/proposed-skill-daily-reward-grants.sql 2>&1); then
            echo "XP candidate accepted absent rehearsal flag" >&2; exit 1
          fi
          echo "$out" | grep -q 'PRODUCTION_SKILL_REWARD_REVOKE_BLOCKED_SHADOW_ONLY'
          {
            echo "SET dadyoom.skill_rewards_rehearsal='enabled';"
            cat scripts/security/proposed-skill-daily-reward-grants.sql
            cat tests/security/shadow-skill-daily-rewards-verify.sql
          } | docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_skill_rewards
      - name: Rehearse grade forgery, grant cutover and restoration on fake student rows
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_grading < tests/security/shadow-grade-write-grants.sql
          if out=$(docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_grading < scripts/security/proposed-grade-write-restrictions.sql 2>&1); then
            echo "Candidate accepted absent rehearsal flag" >&2; exit 1
          fi
          echo "$out" | grep -q 'PRODUCTION_REVOKE_BLOCKED_DISPOSABLE_TEST_ONLY'
          {
            echo "SET dadyoom.grade_grant_rehearsal='enabled';"
            cat scripts/security/proposed-grade-write-restrictions.sql
            cat tests/security/shadow-proposed-grade-grants-verify.sql
          } | docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_grading
