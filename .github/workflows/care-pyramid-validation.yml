name: Validate Dadyoom Care and Arabic Pyramid
on:
  push:
    branches:
      - feature/care-pyramid-on-production-20261019
      - fix/care-pyramid-lint-20261019
      - fix/dadyoom-care-reply-email-e2e-20261019

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install existing dependencies without lockfile changes
        run: npm install --legacy-peer-deps --no-package-lock
      - name: Verify six-level lesson content
        run: npx vitest run lib/learning-pyramid/packs.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: QA script syntax
        run: node --check scripts/final-e2e-release-gate.mjs
      - name: Build current Cloudflare Vinext application (no deploy)
        run: npm run build:vinext
      - name: Verify browser chunks
        run: node scripts/verify-built-client-bundle.mjs
