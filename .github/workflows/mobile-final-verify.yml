name: Mobile Final Verify
# signing-pipeline syntax gate

on:
  workflow_dispatch:
  push:
    branches:
      - fix/mobile-cloud-video-final-20260923

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --legacy-peer-deps --no-package-lock

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Full lint
        run: npm run lint

      - name: Dependency high-severity audit
        run: |
          npm install --package-lock-only --legacy-peer-deps --ignore-scripts
          npm audit --audit-level=high

      - name: Product source gates
        run: |
          npm run release:audit
          npm run release:final-audit
          npm run auth:audit:oauth
          node scripts/check-learning-experience.mjs
          node scripts/check-finish-role-experience.mjs
          node scripts/check-finish-admin.mjs
          node scripts/check-finish-curriculum-ops.mjs
          npm run curriculum:verify
          npm run curriculum:audit:official
          npm run mvp:verify:closure
          node scripts/seed-dadyoom-core-22.mjs
          node scripts/import-curriculum-pack.mjs --pack data/curriculum-packs/bahrain-2026-2027-final/bh-2026-2027-arabic-unified-secondary-g10-s1.json
          node scripts/import-curriculum-pack.mjs --pack data/curriculum-packs/bahrain-2026-2027-final/bh-2026-2027-arabic-unified-secondary-g11-s1.json
          node scripts/import-curriculum-pack.mjs --pack data/curriculum-packs/bahrain-2026-2027-final/bh-2026-2027-arabic-unified-secondary-g12-s1.json

      - name: Targeted lint
        run: >
          npx eslint
          "lib/video/cinematic-client.ts"
          "lib/video/cinematic-avatar-agent.ts"
          "app/api/video/cinematic/route.ts"
          "app/api/video/cinematic/status/route.ts"
          "app/api/video/cinematic/health/route.ts"
          "app/(dashboard)/ask/page.tsx"
          "components/dad-ai/DadLessonVideoButton.tsx"
          "lib/mobile/offline-ai.ts"
          "lib/mobile/hybrid-ai.ts"
          "lib/mobile/native-tts.ts"
          "hooks/use-arabic-speech.ts"
          "services/dad-ai/dad-voice.ts"
          "components/mobile/MobileOAuthBridge.tsx"
          "components/mobile/NativeAppUpdater.tsx"
          "app/api/mobile/android/latest/route.ts"

      - name: Tests
        run: npm run test:run

      - name: Security webhook tests
        run: npm run test:security

      - name: Production mobile server smoke
        shell: bash
        run: |
          set -euo pipefail
          URL="https://dadyoom.mrahmedsamirhamam.workers.dev/api/ai/health"
          BODY="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$URL")"
          echo "$BODY"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.ok !== true) {
              console.error("DADYOOM_PRODUCTION_SERVER_HEALTH=FAIL");
              process.exit(1);
            }
            console.log("DADYOOM_PRODUCTION_SERVER_HEALTH=PASS");
            console.log("DADYOOM_PRODUCTION_BYTEZ_KEYS=" + Number(body?.keyCounts?.bytez ?? 0));
          ' "$BODY"

          AUTH_URL="https://dadyoom.mrahmedsamirhamam.workers.dev/api/auth/provider-status"
          AUTH_BODY="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$AUTH_URL")"
          echo "$AUTH_BODY"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.google !== true || body.configured !== true) {
              console.error("DADYOOM_GOOGLE_PROVIDER=FAIL");
              process.exit(1);
            }
            console.log("DADYOOM_GOOGLE_PROVIDER=PASS");
          ' "$AUTH_BODY"

      - name: Production public SEO smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://dadyoom.mrahmedsamirhamam.workers.dev"

          check_200() {
            local path="$1"
            local label="$2"
            local out
            out="$(mktemp)"
            local code
            code="$(curl --silent --show-error --location --retry 3 --retry-delay 2 --output "$out" --write-out "%{http_code}" "$BASE$path")"
            echo "$label HTTP=$code"
            if [[ "$code" != "200" ]]; then
              echo "$label=FAIL"
              cat "$out" || true
              exit 1
            fi
            echo "$label=PASS"
          }

          check_200 "/" "PRODUCTION_HOME"
          check_200 "/robots.txt" "PRODUCTION_ROBOTS"
          check_200 "/sitemap.xml" "PRODUCTION_SITEMAP"

          ROBOTS="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$BASE/robots.txt")"
          if ! grep -qi "sitemap" <<<"$ROBOTS"; then
            echo "PRODUCTION_ROBOTS_SITEMAP_REFERENCE=FAIL"
            exit 1
          fi
          echo "PRODUCTION_ROBOTS_SITEMAP_REFERENCE=PASS"

          VERSION_BODY="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$BASE/app-version.json" || true)"
          if [[ -n "$VERSION_BODY" ]]; then
            echo "PRODUCTION_APP_VERSION_JSON=$VERSION_BODY"
            node -e '
              const body = JSON.parse(process.argv[1]);
              console.log("PRODUCTION_APP_COMMIT=" + String(body.commit || ""));
              console.log("PRODUCTION_APP_VERSION=" + String(body.version || ""));
              console.log("PRODUCTION_APP_BUILT_AT=" + String(body.builtAt || ""));
            ' "$VERSION_BODY"
          else
            echo "PRODUCTION_APP_VERSION_JSON=UNAVAILABLE"
          fi

      - name: Mobile PWA verify
        run: npm run mobile:pwa:verify

      - name: Shell syntax
        run: |
          bash -n scripts/dadyoom-finalize-ios.sh
          bash -n scripts/dadyoom-ci-build-ios-native.sh

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            "scripts/dadyoom-finalize-android.ps1",
            "scripts/dadyoom-prepare-ios-final.ps1",
            "scripts/dadyoom-final-mobile-video-fix.ps1",
            "scripts/dadyoom-kaggle-video-factory-setup.ps1",
            "scripts/dadyoom-video-benchmark-report.ps1",
            "scripts/dadyoom-all-video-g-drive.ps1",
            "scripts/dadyoom-bootstrap-ios-signing.ps1",
            "scripts/dadyoom-bootstrap-authenticated-e2e.ps1",
            "scripts/dadyoom-final-closure.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Kaggle worker syntax
        run: python -m py_compile kaggle/dadyoom-video-factory/dadyoom_video_factory.py

      - name: Vinext build
        run: npm run build:vinext

      - name: Authenticated product E2E
        if: github.event_name == 'workflow_dispatch'
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://hvqsvtomhlxavmfqoxfz.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2cXN2dG9taGx4YXZtZnFveGZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NjU1MzcsImV4cCI6MjEwMDU0MTUzN30.gkH-gKrAtl6SjcMKzYREZgZOsqE11LLiL2DrC--k7-s"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.DADYOOM_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "AUTHENTICATED_E2E_SECRET=FAIL_MISSING"
            echo "Final workflow_dispatch closure requires a valid Supabase elevated server key."
            exit 42
          fi
          npx playwright install --with-deps chromium
          node scripts/final-e2e-release-gate.mjs

      - name: Authenticated E2E deferred on push
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "AUTHENTICATED_E2E=DEFERRED_TO_FINAL_CLOSURE"
          echo "Push verification remains code/build focused; workflow_dispatch is the fail-closed authenticated release gate."
