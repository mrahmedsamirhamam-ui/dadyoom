name: Mobile Final Verify
# signing-pipeline syntax gate

on:
  push:
    branches:
      - fix/mobile-cloud-video-final-20260923

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --legacy-peer-deps --no-package-lock

      - name: Targeted lint
        run: >
          npx eslint
          "lib/video/cinematic-client.ts"
          "lib/video/cinematic-avatar-agent.ts"
          "app/api/video/cinematic/route.ts"
          "app/api/video/cinematic/status/route.ts"
          "app/api/video/cinematic/health/route.ts"
          "app/(dashboard)/ask/page.tsx"
          "components/dad-ai/DadLessonVideoButton.tsx"
          "lib/mobile/offline-ai.ts"
          "lib/mobile/hybrid-ai.ts"
          "lib/mobile/native-tts.ts"
          "hooks/use-arabic-speech.ts"
          "services/dad-ai/dad-voice.ts"
          "components/mobile/MobileOAuthBridge.tsx"
          "components/mobile/NativeAppUpdater.tsx"
          "app/api/mobile/android/latest/route.ts"

      - name: Tests
        run: npm run test:run

      - name: Production mobile server smoke
        shell: bash
        run: |
          set -euo pipefail
          URL="https://dadyoom.mrahmedsamirhamam.workers.dev/api/ai/health"
          BODY="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$URL")"
          echo "$BODY"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.ok !== true) {
              console.error("DADYOOM_PRODUCTION_SERVER_HEALTH=FAIL");
              process.exit(1);
            }
            console.log("DADYOOM_PRODUCTION_SERVER_HEALTH=PASS");
            console.log("DADYOOM_PRODUCTION_BYTEZ_KEYS=" + Number(body?.keyCounts?.bytez ?? 0));
          ' "$BODY"

          AUTH_URL="https://dadyoom.mrahmedsamirhamam.workers.dev/api/auth/provider-status"
          AUTH_BODY="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$AUTH_URL")"
          echo "$AUTH_BODY"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.google !== true || body.configured !== true) {
              console.error("DADYOOM_GOOGLE_PROVIDER=FAIL");
              process.exit(1);
            }
            console.log("DADYOOM_GOOGLE_PROVIDER=PASS");
          ' "$AUTH_BODY"

      - name: Mobile PWA verify
        run: npm run mobile:pwa:verify

      - name: Shell syntax
        run: |
          bash -n scripts/dadyoom-finalize-ios.sh
          bash -n scripts/dadyoom-ci-build-ios-native.sh

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            "scripts/dadyoom-finalize-android.ps1",
            "scripts/dadyoom-prepare-ios-final.ps1",
            "scripts/dadyoom-final-mobile-video-fix.ps1",
            "scripts/dadyoom-kaggle-video-factory-setup.ps1",
            "scripts/dadyoom-video-benchmark-report.ps1",
            "scripts/dadyoom-all-video-g-drive.ps1",
            "scripts/dadyoom-bootstrap-ios-signing.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Kaggle worker syntax
        run: python -m py_compile kaggle/dadyoom-video-factory/dadyoom_video_factory.py

      - name: Vinext build
        run: npm run build:vinext
