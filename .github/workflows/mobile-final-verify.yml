name: Mobile Final Verify
# signing-pipeline syntax gate

on:
  workflow_dispatch:
  push:
    branches:
      - fix/mobile-cloud-video-final-20260923

concurrency:
  group: mobile-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --legacy-peer-deps --no-package-lock

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Full lint
        run: npm run lint

      - name: Dependency high-severity audit
        run: |
          set -euo pipefail
          npm install --package-lock-only --legacy-peer-deps --ignore-scripts

          echo "RUNTIME_DEPENDENCY_AUDIT"
          set +e
          npm audit --omit=dev --json > runtime-audit.json
          audit_rc=$?
          set -e

          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(
            fs.readFileSync("runtime-audit.json", "utf8"),
          );
          const vulnerabilities = report.vulnerabilities || {};
          const allowedHighAdvisories = new Set([
            "https://github.com/advisories/GHSA-vfj7-8cjw-p6xm",
          ]);

          function highTerminalAdvisories(name, seen = new Set()) {
            if (seen.has(name)) return [];
            seen.add(name);

            const item = vulnerabilities[name];
            if (!item) return [];

            const terminals = [];
            for (const via of item.via || []) {
              if (typeof via === "string") {
                terminals.push(
                  ...highTerminalAdvisories(
                    via,
                    new Set(seen),
                  ),
                );
                continue;
              }

              const severity = String(via?.severity || "").toLowerCase();
              if (severity === "high" || severity === "critical") {
                terminals.push({
                  package: name,
                  url: String(via?.url || ""),
                  title: String(via?.title || via?.name || name),
                  severity,
                });
              }
            }

            return terminals;
          }

          const blocking = [];

          for (const [name, item] of Object.entries(vulnerabilities)) {
            const severity = String(item?.severity || "").toLowerCase();
            if (severity !== "high" && severity !== "critical") continue;

            const terminals = highTerminalAdvisories(name);
            const permitted =
              terminals.length > 0 &&
              terminals.every(issue =>
                allowedHighAdvisories.has(issue.url),
              );

            if (!permitted) {
              blocking.push({
                name,
                severity,
                terminals,
              });
            }
          }

          if (blocking.length > 0) {
            console.error(
              "RUNTIME_DEPENDENCY_AUDIT=FAIL",
              JSON.stringify(blocking, null, 2),
            );
            process.exit(1);
          }

          const allowedSeen = Object.keys(vulnerabilities)
            .filter(name => {
              const item = vulnerabilities[name];
              const severity = String(item?.severity || "").toLowerCase();
              if (severity !== "high" && severity !== "critical") return false;
              const terminals = highTerminalAdvisories(name);
              return (
                terminals.length > 0 &&
                terminals.every(issue =>
                  allowedHighAdvisories.has(issue.url),
                )
              );
            });

          console.log(
            "RUNTIME_DEPENDENCY_AUDIT=PASS",
            "temporary_unpatched_exception=" +
              (allowedSeen.length ? "GHSA-vfj7-8cjw-p6xm" : "none"),
          );
          NODE

          echo "FULL_DEPENDENCY_AUDIT_ADVISORY"
          npm audit --audit-level=high || true

      - name: Product source gates
        run: |
          npm run release:audit
          npm run release:final-audit
          npm run auth:audit:oauth
          node scripts/check-learning-experience.mjs
          node scripts/check-finish-role-experience.mjs
          node scripts/check-finish-admin.mjs
          node scripts/check-finish-curriculum-ops.mjs
          npm run curriculum:gate:official-22
          npm run curriculum:audit:secondary-tracks
          # Canonical national curriculum closure is enforced above by curriculum:gate:official-22.
          # Legacy catalog/closure/seed/import checks predate the 22-country closure and are intentionally not release gates.
          # Verification must not mutate curriculum data during Commerce launch.

      - name: Targeted lint
        run: >
          npx eslint
          "lib/video/cinematic-client.ts"
          "lib/video/cinematic-avatar-agent.ts"
          "app/api/video/cinematic/route.ts"
          "app/api/video/cinematic/status/route.ts"
          "app/api/video/cinematic/health/route.ts"
          "app/(dashboard)/ask/page.tsx"
          "components/dad-ai/DadLessonVideoButton.tsx"
          "lib/mobile/offline-ai.ts"
          "lib/mobile/hybrid-ai.ts"
          "lib/mobile/native-tts.ts"
          "hooks/use-arabic-speech.ts"
          "services/dad-ai/dad-voice.ts"
          "components/mobile/MobileOAuthBridge.tsx"
          "components/mobile/NativeAppUpdater.tsx"
          "app/api/mobile/android/latest/route.ts"

      - name: Tests
        run: npm run test:run

      - name: Security webhook tests
        run: npm run test:security

      - name: Production mobile server smoke
        shell: bash
        run: |
          set -euo pipefail
          URL="https://dadyoom.mrahmedsamirhamam.workers.dev/api/ai/health"
          BODY="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$URL")"
          echo "$BODY"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.ok !== true) {
              console.error("DADYOOM_PRODUCTION_SERVER_HEALTH=FAIL");
              process.exit(1);
            }
            console.log("DADYOOM_PRODUCTION_SERVER_HEALTH=PASS");
            console.log("DADYOOM_PRODUCTION_BYTEZ_KEYS=" + Number(body?.keyCounts?.bytez ?? 0));
          ' "$BODY"

          AUTH_URL="https://dadyoom.mrahmedsamirhamam.workers.dev/api/auth/provider-status"
          AUTH_BODY="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$AUTH_URL")"
          echo "$AUTH_BODY"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.google !== true || body.configured !== true) {
              console.error("DADYOOM_GOOGLE_PROVIDER=FAIL");
              process.exit(1);
            }
            console.log("DADYOOM_GOOGLE_PROVIDER=PASS");
          ' "$AUTH_BODY"

      - name: Production public SEO smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://dadyoom.mrahmedsamirhamam.workers.dev"

          check_200() {
            local path="$1"
            local label="$2"
            local out
            out="$(mktemp)"
            local code
            code="$(curl --silent --show-error --location --retry 3 --retry-delay 2 --output "$out" --write-out "%{http_code}" "$BASE$path")"
            echo "$label HTTP=$code"
            if [[ "$code" != "200" ]]; then
              echo "$label=FAIL"
              cat "$out" || true
              exit 1
            fi
            echo "$label=PASS"
          }

          check_200 "/" "PRODUCTION_HOME"
          check_200 "/robots.txt" "PRODUCTION_ROBOTS"
          check_200 "/sitemap.xml" "PRODUCTION_SITEMAP"

          ROBOTS="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$BASE/robots.txt")"
          if ! grep -qi "sitemap" <<<"$ROBOTS"; then
            echo "PRODUCTION_ROBOTS_SITEMAP_REFERENCE=FAIL"
            exit 1
          fi
          echo "PRODUCTION_ROBOTS_SITEMAP_REFERENCE=PASS"

          VERSION_BODY="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$BASE/app-version.json" || true)"
          if [[ -n "$VERSION_BODY" ]]; then
            echo "PRODUCTION_APP_VERSION_JSON=$VERSION_BODY"
            node -e '
              const body = JSON.parse(process.argv[1]);
              console.log("PRODUCTION_APP_COMMIT=" + String(body.commit || ""));
              console.log("PRODUCTION_APP_VERSION=" + String(body.version || ""));
              console.log("PRODUCTION_APP_BUILT_AT=" + String(body.builtAt || ""));
            ' "$VERSION_BODY"
          else
            echo "PRODUCTION_APP_VERSION_JSON=UNAVAILABLE"
          fi


      - name: Mobile PWA verify
        run: npm run mobile:pwa:verify

      - name: Shell syntax
        run: |
          bash -n scripts/dadyoom-finalize-ios.sh
          bash -n scripts/dadyoom-ci-build-ios-native.sh

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            "scripts/dadyoom-finalize-android.ps1",
            "scripts/dadyoom-prepare-ios-final.ps1",
            "scripts/dadyoom-final-mobile-video-fix.ps1",
            "scripts/dadyoom-kaggle-video-factory-setup.ps1",
            "scripts/dadyoom-video-benchmark-report.ps1",
            "scripts/dadyoom-all-video-g-drive.ps1",
            "scripts/dadyoom-bootstrap-ios-signing.ps1",
            "scripts/dadyoom-bootstrap-authenticated-e2e.ps1",
            "scripts/dadyoom-final-closure.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Kaggle worker syntax
        run: python -m py_compile kaggle/dadyoom-video-factory/dadyoom_video_factory.py

      - name: Vinext build
        run: npm run build:vinext

      - name: Production deployment sync and front-door smoke
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          WORKER="https://dadyoom.mrahmedsamirhamam.workers.dev"
          PAGES="https://dadyoom.pages.dev"

          matched=0
          for attempt in $(seq 1 120); do
            set +e
            body="$(curl --silent --show-error --max-time 20 "$WORKER/api/deploy/version")"
            rc=$?
            set -e

            if [[ "$rc" == "0" && -n "$body" ]]; then
              actual="$(node -e '
                try {
                  const body = JSON.parse(process.argv[1]);
                  process.stdout.write(String(body.commit || ""));
                } catch {
                  process.stdout.write("");
                }
              ' "$body")"

              echo "DEPLOY_SYNC attempt=$attempt expected=$EXPECTED_SHA actual=$actual"

              if [[ "$actual" == "$EXPECTED_SHA" ]]; then
                matched=1
                break
              fi
            else
              echo "DEPLOY_SYNC attempt=$attempt curl_rc=$rc"
            fi

            sleep 10
          done

          if [[ "$matched" != "1" ]]; then
            echo "DADYOOM_DEPLOY_SYNC=FAIL"
            exit 1
          fi

          echo "DADYOOM_DEPLOY_SYNC=PASS"

          check_200() {
            local base="$1"
            local path="$2"
            local label="$3"

            for retry in 1 2 3; do
              out="$(mktemp)"
              set +e
              code="$(curl --silent --show-error --location --max-time 30 --output "$out" --write-out "%{http_code}" "$base$path")"
              rc=$?
              set -e

              echo "$label retry=$retry curl_rc=$rc http=$code"

              if [[ "$rc" == "0" && "$code" == "200" ]]; then
                rm -f "$out"
                return 0
              fi

              rm -f "$out"
              sleep 3
            done

            echo "$label=FAIL"
            return 1
          }

          for path in "/" "/courses" "/login" "/pricing"; do
            check_200 "$WORKER" "$path" "WORKER_$path"
            check_200 "$PAGES" "$path" "PAGES_$path"
          done

          catalog="$(curl --fail --silent --show-error --max-time 30 "$WORKER/api/courses/catalog?country=BH&grade=1")"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (!Array.isArray(body.units) || body.units.length < 1) {
              console.error("DADYOOM_SCOPED_CATALOG=FAIL");
              process.exit(1);
            }
            const lessons = body.units.reduce(
              (sum, unit) => sum + Number(unit?.lessons?.length || 0),
              0,
            );
            if (lessons < 1) {
              console.error("DADYOOM_SCOPED_CATALOG_LESSONS=FAIL");
              process.exit(1);
            }
            console.log("DADYOOM_SCOPED_CATALOG=PASS units=" + body.units.length + " lessons=" + lessons);
          ' "$catalog"

          echo "DADYOOM_FRONT_DOOR_SMOKE=PASS"

      - name: Notify IndexNow after deploy
        env:
          DADYOOM_INDEXNOW_SITE: "https://dadyoom.dpdns.org"
        run: node scripts/submit-indexnow.mjs

      - name: Authenticated product E2E
        if: github.event_name == 'workflow_dispatch'
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://hvqsvtomhlxavmfqoxfz.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2cXN2dG9taGx4YXZtZnFveGZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NjU1MzcsImV4cCI6MjEwMDU0MTUzN30.gkH-gKrAtl6SjcMKzYREZgZOsqE11LLiL2DrC--k7-s"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.DADYOOM_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "AUTHENTICATED_E2E_SECRET=FAIL_MISSING"
            echo "Final workflow_dispatch closure requires a valid Supabase elevated server key."
            exit 42
          fi
          npx playwright install --with-deps chromium
          node scripts/final-e2e-release-gate.mjs

      - name: Authenticated E2E deferred on push
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "AUTHENTICATED_E2E=DEFERRED_TO_FINAL_CLOSURE"
          echo "Push verification remains code/build focused; workflow_dispatch is the fail-closed authenticated release gate."
