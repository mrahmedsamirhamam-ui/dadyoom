name: REVIEW ONLY - role RLS safety in disposable PostgreSQL

on:
  push:
    branches:
      - security/profile-role-approval-review-20261106
  pull_request:
    paths:
      - 'docs/security/REVIEW_ONLY_ROLE_APPROVAL_AND_RLS_2026-11-06.sql'
      - 'tests/fixtures/auth-profile-role-postgres-setup.sql'
      - 'tests/auth-profile-role-postgres-integration.sql'
      - '.github/workflows/review-role-rls-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres-security:
    name: Verify profile-role escalation denied (ephemeral DB only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral_test_only
          POSTGRES_DB: role_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d role_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ephemeral_test_only
      PGDATABASE: role_test
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version
      - name: Create disposable simulated auth/profile schema
        run: psql -v ON_ERROR_STOP=1 -f tests/fixtures/auth-profile-role-postgres-setup.sql
      - name: Apply REVIEW-ONLY proposal to disposable database
        run: psql -v ON_ERROR_STOP=1 -f docs/security/REVIEW_ONLY_ROLE_APPROVAL_AND_RLS_2026-11-06.sql
      - name: Verify signup isolation, immutable roles and pending approvals
        run: psql -v ON_ERROR_STOP=1 -f tests/auth-profile-role-postgres-integration.sql
