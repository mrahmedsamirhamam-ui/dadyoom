name: Dadyoom three-path learning pilot

on:
  push:
    branches:
      - feat/adaptive-goal-paths-hall-pilot-20261105
  pull_request:
    paths:
      - 'app/pilot/haal/**'
      - 'lib/adaptive-goal-paths/**'
      - 'tests/haal-adaptive-pilot.node.test.mjs'
      - 'tests/haal-adaptive-teacher-overview.node.test.mjs'
      - 'tests/haal-adaptive-release-gate.node.test.mjs'
      - 'tests/haal-adaptive-server-grading.node.test.mjs'
      - 'app/api/pilot/haal/**'
      - '.github/workflows/adaptive-goal-path-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goal-path-pilot:
    name: Validate curriculum goal, learner agency and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Student agency, goal and mastery safety tests
        run: node --test tests/haal-adaptive-pilot.node.test.mjs tests/haal-adaptive-teacher-overview.node.test.mjs tests/haal-adaptive-release-gate.node.test.mjs tests/haal-adaptive-server-grading.node.test.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript strict check
        run: npx tsc --noEmit
      - name: ESLint for pilot pages
        run: npx eslint app/pilot/haal/page.tsx app/pilot/haal/teacher/page.tsx
