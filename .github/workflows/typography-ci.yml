name: Global Arabic typography quality

on:
  pull_request:
    paths:
      - 'app/globals.css'
      - 'tests/typography-dadyoom.test.ts'
      - '.github/workflows/typography-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typography:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run tests/typography-dadyoom.test.ts
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
