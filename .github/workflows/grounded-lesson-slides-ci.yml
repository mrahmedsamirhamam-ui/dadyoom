name: Grounded lesson presentations

on:
  pull_request:
    paths:
      - "lib/lesson-slides/**"
      - "components/lesson/LessonLearningSlides.tsx"
      - "app/lessons/[id]/study/LessonStudyStudio.tsx"
      - "app/api/lessons/study/route.ts"
      - "app/api/lessons/[id]/pptx/route.ts"
      - "tests/grounded-lesson-slides.test.ts"
      - ".github/workflows/grounded-lesson-slides-ci.yml"

permissions:
  contents: read

jobs:
  lesson-presentations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run lesson presentation tests
        run: npx vitest run tests/grounded-lesson-slides.test.ts
      - name: Typecheck changed application
        run: npx tsc --noEmit
      - name: Lint changed presentation files
        run: npx eslint lib/lesson-slides/grounded-deck.ts components/lesson/LessonLearningSlides.tsx app/api/lessons/study/route.ts app/api/lessons/'[id]'/pptx/route.ts app/lessons/'[id]'/study/LessonStudyStudio.tsx tests/grounded-lesson-slides.test.ts
