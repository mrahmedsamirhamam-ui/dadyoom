      - 'scripts/security-assessment-permissions-audit.sql'
      - 'scripts/audit-assessment-consumers.mjs'
      - 'tests/security/assessment-grants-audit.test.ts'
      - 'tests/security/shadow-question-grants.sql'
      - 'tests/security/shadow-grade-write-grants.sql'
      - 'scripts/security/proposed-grade-write-restrictions.sql'
      - 'scripts/security/proposed-adaptive-progress-write-restrictions.sql'
      - 'tests/security/shadow-adaptive-grants-setup.sql'
      - 'tests/security/shadow-adaptive-grants-verify.sql'
      - 'features/learning-plan/services/adaptive-path-lifecycle.ts'
      - 'tests/security/shadow-proposed-grade-grants-verify.sql'
      - 'tests/security/owner-scoped-progress-repository.test.ts'
      - 'features/lesson-mastery/actions/syncLessonMastery.ts'
      - 'tests/security/lesson-mastery-completion-only.test.ts'
      - 'features/lesson-mastery/services/score-graded-activities.ts'
      - 'tests/security/weighted-activity-mastery.test.ts'
      - 'tests/security/lesson-completion-entrypoints.test.ts'
      - 'tests/security/lesson-mastery-gates.test.ts'
      - 'features/student-progress/services/completion-gates.ts'
      - 'scripts/curriculum-coverage.mjs'
      - 'scripts/curriculum-production-audit.sql'
      - 'lib/curriculum/book-catalog-reference.ts'
      - 'app/lessons/[id]/page.tsx'
      - 'tests/curriculum-book-catalog-reference.test.ts'
      - 'types/cache-life.d.ts'
      - 'tests/cloudflare-cache-compatibility.test.ts'
      - 'tests/curriculum-readiness-live-gates.test.ts'
      - 'scripts/smoke-next-production-runtime.mjs'
      - 'app/quiz/**'
      - 'tests/security/safe-questions-view.test.ts'
      - 'supabase/migrations/20261022150911_create_dadyoom_student_safe_questions_view.sql'
      - 'supabase/migrations/20261022151106_restrict_dadyoom_student_questions_view_to_select_only.sql'
      - 'scripts/verify-curriculum-packs.mjs'
      - 'lib/curriculum-packs/**'
      - 'data/curriculum-packs/**'
      - 'tests/curriculum-coverage.test.ts'
      - '.github/workflows/curriculum-coverage-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify curriculum pack schemas
        run: npm run curriculum:verify
      - name: Verify country coverage report
        run: npm run curriculum:coverage
      - name: Test that missing packs never report full country coverage
        run: npx vitest run tests/curriculum-coverage.test.ts
      - name: Verify published assessment and import-placeholder readiness audit
        run: npx vitest run tests/curriculum-readiness-live-gates.test.ts
      - name: Verify book index nodes cannot masquerade as graded lessons
        run: npx vitest run tests/curriculum-book-catalog-reference.test.ts
      - name: Verify public Next cache type declarations are Worker-compatible
        run: npx vitest run tests/cloudflare-cache-compatibility.test.ts
      - name: Execute real lesson practice auth and trusted-key scoring tests
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/lesson-practice-server-grading.test.ts
      - name: Verify adaptive practice progress cannot falsely award mastery
        run: npx vitest run tests/adaptive-lesson-practice.test.ts
      - name: Verify public lesson UI hides private grading widgets
        run: npx vitest run tests/public-lesson-auth-boundary.test.ts
      - name: Verify canonical lesson completion entry points
        run: npx vitest run tests/security/lesson-completion-entrypoints.test.ts tests/security/lesson-mastery-gates.test.ts
      - name: Verify authoritative lesson question grading
        run: npx vitest run tests/security/server-graded-mcq.test.ts
      - name: Execute no-network grading API and student ownership runtime tests
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/question-answer-route-runtime.test.ts
      - name: Verify private Bahrain draft preview requires server-owned entitlement
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/bahrain-draft-preview-access.test.ts
      - name: Execute lesson bundle / activity field redaction tests
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/student-safe-lesson-activities.test.ts
      - name: Check PostgreSQL and TypeScript activity-key filtering parity
        run: npx vitest run tests/security/activity-rpc-redaction-parity.test.ts
      - name: Verify student-safe question view migration and quiz cutover
        run: npx vitest run tests/security/safe-questions-view.test.ts
      - name: Verify lesson question keys do not reach student payloads
        run: npx vitest run tests/security/student-question-payload.test.ts
      - name: Verify that participation alone never grants academic mastery
        run: npx vitest run tests/security/lesson-mastery-completion-only.test.ts
      - name: Verify weighted lesson mastery equals completion scoring
        run: npx vitest run tests/security/weighted-activity-mastery.test.ts
      - name: Verify private answer-key lookup
        run: npx vitest run tests/security/server-only-answer-key-read.test.ts
      - name: Verify teacher-only stored answer-key access
        run: npx vitest run tests/security/teacher-private-question-access.test.ts
      - name: Verify private activity keys stay on server
        run: npx vitest run tests/security/server-private-activity-answer-read.test.ts
      - name: Verify server grading and completed-progress preservation
        run: npx vitest run tests/security/activity-check-route.test.ts
      - name: Verify owner-scoped trusted progress repository
        run: npx vitest run tests/security/owner-scoped-progress-repository.test.ts
      - name: Verify tutoring cannot award academic mastery
        run: npx vitest run tests/security/tutor-not-mastery.test.ts
      - name: Execute no-network formative grading spoofing and no-persistence tests
        run: npx vitest run --config tests/security/formative-runtime.vitest.config.mts tests/security/formative-grading-no-persistence.test.ts
      - name: Verify AI assessment keys and authoritative session progression
        run: npx vitest run tests/security/ai-assessment-client-trust.test.ts
      - name: Verify AI assessment analytics with mocked trusted keys
        run: npx vitest run tests/security/ai-session-analytics.test.ts
      - name: Index all static assessment table / RPC consumers
        run: node scripts/audit-assessment-consumers.mjs
      - name: Save nonsecret consumer inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assessment-source-consumers
          path: assessment-consumers-ci.json
          retention-days: 3
          if-no-files-found: ignore
      - name: Verify read-only assessment grants audit
        run: npx vitest run tests/security/assessment-grants-audit.test.ts
      - name: Verify public lesson bundle excludes answer keys
        run: npx vitest run tests/security/public-lesson-bundle-rpc.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Start compiled Next.js and smoke-test anonymous runtime
        run: node scripts/smoke-next-production-runtime.mjs

  shadow-question-grants:
    name: Disposable PostgreSQL question grants + rollback
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: disposable-ci-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise secure view cutover and rollback against disposable database
        shell: bash
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$PG_CONTAINER_ID"
          docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < tests/security/shadow-question-grants.sql
          echo "SHADOW_QUESTION_GRANTS_REHEARSAL=PASS"
      - name: Rehearse column grants without breaking invoker student question view
        shell: bash
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$PG_CONTAINER_ID"
          docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < tests/security/shadow-question-column-grants.sql
          echo "SHADOW_QUESTION_COLUMN_GRANTS_REHEARSAL=PASS"
      - name: Prove forged own scores and rehearse six-table write-grant cutover
        shell: bash
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$PG_CONTAINER_ID"
          docker exec "$PG_CONTAINER_ID" createdb -U postgres shadow_grading
          docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_grading \
            < tests/security/shadow-grade-write-grants.sql
          echo "SHADOW_GRADE_WRITES_REHEARSAL=PASS"
      - name: Ensure grade-write candidate refuses other databases and missing CI approval flag
        shell: bash
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$PG_CONTAINER_ID"
          if error_text=$( {
              echo "SET dadyoom.grade_grant_rehearsal = 'enabled';"
              cat scripts/security/proposed-grade-write-restrictions.sql
            } | docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres 2>&1 ); then
            echo "Candidate unexpectedly accepted a database other than shadow_grading" >&2
            exit 1
          fi
          printf '%s\n' "$error_text" | grep -q 'PRODUCTION_REVOKE_BLOCKED_DISPOSABLE_TEST_ONLY'
          if error_text=$(docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_grading \
              < scripts/security/proposed-grade-write-restrictions.sql 2>&1); then
            echo "Candidate unexpectedly ran without the disposable test flag" >&2
            exit 1
          fi
          printf '%s\n' "$error_text" | grep -q 'PRODUCTION_REVOKE_BLOCKED_DISPOSABLE_TEST_ONLY'
          echo "SHADOW_GRADE_CANDIDATE_NONPRODUCTION_GUARD=PASS"
      - name: Rehearse exact six-table grade-write restriction candidate, trusted writes and rollback
        shell: bash
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$PG_CONTAINER_ID"
          {
            echo "SET dadyoom.grade_grant_rehearsal = 'enabled';"
            cat scripts/security/proposed-grade-write-restrictions.sql
            cat tests/security/shadow-proposed-grade-grants-verify.sql
          } | docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_grading
          echo "SHADOW_GRADE_RESTRICTION_CANDIDATE_REHEARSAL=PASS"
      - name: Reproduce adaptive grade forgery and rehearse guarded 3-table role lockdown
        shell: bash
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$PG_CONTAINER_ID"
          docker exec "$PG_CONTAINER_ID" createdb -U postgres shadow_adaptive
          docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_adaptive \
            < tests/security/shadow-adaptive-grants-setup.sql
          if error_text=$( {
              echo "SET dadyoom.adaptive_rehearsal = 'enabled';"
              cat scripts/security/proposed-adaptive-progress-write-restrictions.sql
            } | docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres 2>&1); then
            echo "Adaptive proposal unexpectedly accepted wrong database" >&2
            exit 1
          fi
          printf '%s\n' "$error_text" | grep -q 'PRODUCTION_ADAPTIVE_REVOKE_BLOCKED_DISPOSABLE_TEST_ONLY'
          if error_text=$(docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_adaptive \
              < scripts/security/proposed-adaptive-progress-write-restrictions.sql 2>&1); then
            echo "Adaptive proposal unexpectedly accepted missing test flag" >&2
            exit 1
          fi
          printf '%s\n' "$error_text" | grep -q 'PRODUCTION_ADAPTIVE_REVOKE_BLOCKED_DISPOSABLE_TEST_ONLY'
          {
            echo "SET dadyoom.adaptive_rehearsal = 'enabled';"
            cat scripts/security/proposed-adaptive-progress-write-restrictions.sql
            cat tests/security/shadow-adaptive-grants-verify.sql
          } | docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_adaptive
          echo "SHADOW_ADAPTIVE_ROLE_LOCKDOWN_REHEARSAL=PASS"
      - name: Rehearse direct lesson RPC nested grading-key redaction and rollback
        shell: bash
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$PG_CONTAINER_ID"
          docker exec "$PG_CONTAINER_ID" createdb -U postgres shadow_activity_rpc
          cat \
            tests/security/shadow-public-activity-rpc-setup.sql \
            supabase/migrations/20261022195032_sanitize_public_get_lesson_page_bundle_answer_keys.sql \
            tests/security/shadow-public-activity-rpc-baseline.sql \
            scripts/security/proposed-public-lesson-activity-rpc.sql \
            tests/security/shadow-public-activity-rpc-verified.sql \
            supabase/migrations/20261022195032_sanitize_public_get_lesson_page_bundle_answer_keys.sql \
            tests/security/shadow-public-activity-rpc-rollback.sql \
            | docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_activity_rpc
          echo "SHADOW_PUBLIC_ACTIVITY_RPC_REHEARSAL=PASS"
