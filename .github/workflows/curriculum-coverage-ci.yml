      - 'supabase/migrations/20261022195032_sanitize_public_get_lesson_page_bundle_answer_keys.sql'
      - 'scripts/security/proposed-public-lesson-activity-rpc.sql'
      - 'tests/security/shadow-public-activity-rpc-setup.sql'
      - 'tests/security/shadow-public-activity-rpc-baseline.sql'
      - 'tests/security/shadow-public-activity-rpc-verified.sql'
      - 'tests/security/shadow-public-activity-rpc-rollback.sql'
      - 'tests/security/shadow-question-column-grants.sql'
      - 'tests/security/activity-rpc-redaction-parity.test.ts'
      - 'tests/security/student-question-payload.test.ts'
      - 'features/questions/services/public-lesson-questions.ts'
      - 'features/lessons/queries/getLessonPageBundle.ts'
