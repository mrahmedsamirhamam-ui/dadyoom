name: Curriculum coverage integrity

on:
  pull_request:
    paths:
      - 'app/api/progress/**'
      - 'app/api/lessons/complete/**'
      - 'app/api/questions/answer/**'
      - 'app/api/lesson-activities/check/**'
      - 'lib/lesson-activities/progress-state.ts'
      - 'tests/security/activity-check-route.test.ts'
      - 'components/lesson/MultipleChoiceQuestion.tsx'
      - 'app/lessons/**/page.tsx'
      - 'features/questions/services/grade-stored-mcq.ts'
      - 'features/questions/queries/getLessonQuestions.ts'
      - 'features/teacher/queries/getLessonQuestions.ts'
      - 'features/teacher/actions/manageLessonQuestions.ts'
      - 'tests/security/server-private-activity-answer-read.test.ts'
      - 'tests/security/teacher-private-question-access.test.ts'
      - 'tests/security/server-graded-mcq.test.ts'
      - 'tests/security/server-only-answer-key-read.test.ts'
      - 'tests/security/public-lesson-bundle-rpc.test.ts'
      - 'supabase/migrations/20261022195032_sanitize_public_get_lesson_page_bundle_answer_keys.sql'
      - 'tests/security/student-question-payload.test.ts'
      - 'features/questions/services/public-lesson-questions.ts'
      - 'features/lessons/queries/getLessonPageBundle.ts'
      - 'features/adaptive-learning/queries/getWeakQuestions.ts'
      - 'features/adaptive-learning/components/WeakQuestionsReview.tsx'
      - 'app/lessons/**/CompleteLessonButton.tsx'
      - 'features/student-progress/actions/completeLesson.ts'
      - 'features/student-progress/repositories/progress.repository.ts'
      - 'features/student-progress/services/progress.ts'
      - 'app/api/semantic-search/stream/route.ts'
      - 'app/api/ai/assessment/submit/route.ts'
      - 'app/api/ai/assessment/**'
      - 'features/assessment/services/advanceAssessmentSession.ts'
      - 'features/assessment/services/getAssessmentSessionAnalytics.ts'
      - 'tests/security/ai-assessment-client-trust.test.ts'
      - 'tests/security/ai-session-analytics.test.ts'
      - 'features/semantic-search/components/LessonSemanticSearch.tsx'
      - 'features/semantic-search/services/updateLessonMastery.ts'
      - 'tests/security/tutor-not-mastery.test.ts'
      - 'scripts/security-assessment-permissions-audit.sql'
      - 'tests/security/assessment-grants-audit.test.ts'
      - 'tests/security/owner-scoped-progress-repository.test.ts'
      - 'features/lesson-mastery/actions/syncLessonMastery.ts'
      - 'tests/security/lesson-mastery-completion-only.test.ts'
      - 'features/lesson-mastery/services/score-graded-activities.ts'
      - 'tests/security/weighted-activity-mastery.test.ts'
      - 'tests/security/lesson-completion-entrypoints.test.ts'
      - 'tests/security/lesson-mastery-gates.test.ts'
      - 'features/student-progress/services/completion-gates.ts'
      - 'scripts/curriculum-coverage.mjs'
      - 'scripts/curriculum-production-audit.sql'
      - 'app/quiz/**'
      - 'tests/security/safe-questions-view.test.ts'
      - 'supabase/migrations/20261022150911_create_dadyoom_student_safe_questions_view.sql'
      - 'supabase/migrations/20261022151106_restrict_dadyoom_student_questions_view_to_select_only.sql'
      - 'scripts/verify-curriculum-packs.mjs'
      - 'lib/curriculum-packs/**'
      - 'data/curriculum-packs/**'
      - 'tests/curriculum-coverage.test.ts'
      - '.github/workflows/curriculum-coverage-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify curriculum pack schemas
        run: npm run curriculum:verify
      - name: Verify country coverage report
        run: npm run curriculum:coverage
      - name: Test that missing packs never report full country coverage
        run: npx vitest run tests/curriculum-coverage.test.ts
      - name: Verify canonical lesson completion entry points
        run: npx vitest run tests/security/lesson-completion-entrypoints.test.ts tests/security/lesson-mastery-gates.test.ts
      - name: Verify authoritative lesson question grading
        run: npx vitest run tests/security/server-graded-mcq.test.ts
      - name: Verify student-safe question view migration and quiz cutover
        run: npx vitest run tests/security/safe-questions-view.test.ts
      - name: Verify lesson question keys do not reach student payloads
        run: npx vitest run tests/security/student-question-payload.test.ts
      - name: Verify that participation alone never grants academic mastery
        run: npx vitest run tests/security/lesson-mastery-completion-only.test.ts
      - name: Verify weighted lesson mastery equals completion scoring
        run: npx vitest run tests/security/weighted-activity-mastery.test.ts
      - name: Verify private answer-key lookup
        run: npx vitest run tests/security/server-only-answer-key-read.test.ts
      - name: Verify teacher-only stored answer-key access
        run: npx vitest run tests/security/teacher-private-question-access.test.ts
      - name: Verify private activity keys stay on server
        run: npx vitest run tests/security/server-private-activity-answer-read.test.ts
      - name: Verify server grading and completed-progress preservation
        run: npx vitest run tests/security/activity-check-route.test.ts
      - name: Verify owner-scoped trusted progress repository
        run: npx vitest run tests/security/owner-scoped-progress-repository.test.ts
      - name: Verify tutoring cannot award academic mastery
        run: npx vitest run tests/security/tutor-not-mastery.test.ts
      - name: Verify AI assessment keys and authoritative session progression
        run: npx vitest run tests/security/ai-assessment-client-trust.test.ts
      - name: Verify AI assessment analytics with mocked trusted keys
        run: npx vitest run tests/security/ai-session-analytics.test.ts
      - name: Verify read-only assessment grants audit
        run: npx vitest run tests/security/assessment-grants-audit.test.ts
      - name: Verify public lesson bundle excludes answer keys
        run: npx vitest run tests/security/public-lesson-bundle-rpc.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
