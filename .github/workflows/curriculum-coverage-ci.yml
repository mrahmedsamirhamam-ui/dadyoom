permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify curriculum pack schemas
        run: npm run curriculum:verify
      - name: Verify country coverage report
        run: npm run curriculum:coverage
      - name: Test that missing packs never report full country coverage
        run: npx vitest run tests/curriculum-coverage.test.ts
      - name: Verify published assessment and import-placeholder readiness audit
        run: npx vitest run tests/curriculum-readiness-live-gates.test.ts
      - name: Verify book index nodes cannot masquerade as graded lessons
        run: npx vitest run tests/curriculum-book-catalog-reference.test.ts
      - name: Verify public Next cache type declarations are Worker-compatible
        run: npx vitest run tests/cloudflare-cache-compatibility.test.ts
      - name: Execute real lesson practice auth and trusted-key scoring tests
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/lesson-practice-server-grading.test.ts
      - name: Verify adaptive practice progress cannot falsely award mastery
        run: npx vitest run tests/adaptive-lesson-practice.test.ts
      - name: Verify public lesson UI hides private grading widgets
        run: npx vitest run tests/public-lesson-auth-boundary.test.ts
      - name: Verify unified XP totals across all paged lesson, skill and challenge rows
        run: npx vitest run tests/security/unified-xp-pagination.test.ts
      - name: Reject forged daily challenge score and skill before XP award
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/daily-challenge-trusted-target.test.ts
      - name: Block unverified skill practice scores from awarding XP
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/skill-progress-no-forged-xp.test.ts
      - name: Verify protected AI speaking audio and streamed upload limits
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/speaking-upload-authorization.test.ts
      - name: Reject partial lesson completion and XP snapshots
        run: npx vitest run tests/security/lesson-completion-full-evidence.test.ts
      - name: Verify fully paged student lesson history and safe private preview
        run: npx vitest run tests/security/lesson-bundle-attempt-pagination.test.ts
      - name: Block private grading tables from browser-side Supabase access
        run: npx vitest run tests/security/browser-grade-boundary.test.mjs
      - name: Verify weak-question reset authorizes student and avoids grade-race deletion
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/reset-weak-question-route.test.ts
      - name: Verify canonical lesson completion entry points
        run: npx vitest run tests/security/lesson-completion-entrypoints.test.ts tests/security/lesson-mastery-gates.test.ts
      - name: Verify authoritative lesson question grading
        run: npx vitest run tests/security/server-graded-mcq.test.ts
      - name: Verify study-play forged-answer rejection
        run: npx vitest run features/study-play/services/grade-study-play.test.ts
      - name: Verify vocabulary arcade never trusts client XP
        run: npx vitest run tests/security/legacy-game-rewards.test.ts
      - name: Execute no-network grading API and student ownership runtime tests
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/question-answer-route-runtime.test.ts
      - name: Verify private Bahrain draft preview requires server-owned entitlement
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/bahrain-draft-preview-access.test.ts
      - name: Execute lesson bundle / activity field redaction tests
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/student-safe-lesson-activities.test.ts
      - name: Check PostgreSQL and TypeScript activity-key filtering parity
        run: npx vitest run tests/security/activity-rpc-redaction-parity.test.ts
      - name: Verify student-safe question view migration and quiz cutover
        run: npx vitest run tests/security/safe-questions-view.test.ts
      - name: Verify lesson question keys do not reach student payloads
        run: npx vitest run tests/security/student-question-payload.test.ts
      - name: Verify that participation alone never grants academic mastery
        run: npx vitest run tests/security/lesson-mastery-completion-only.test.ts
      - name: Verify weighted lesson mastery equals completion scoring
        run: npx vitest run tests/security/weighted-activity-mastery.test.ts
      - name: Verify complete paged scoring under PostgREST row caps
        run: npx vitest run tests/security/graded-activity-pagination.test.ts
      - name: Verify private answer-key lookup
        run: npx vitest run tests/security/server-only-answer-key-read.test.ts
      - name: Verify teacher-only stored answer-key access
        run: npx vitest run tests/security/teacher-private-question-access.test.ts
      - name: Verify private activity keys stay on server
        run: npx vitest run tests/security/server-private-activity-answer-read.test.ts
      - name: Verify server grading and completed-progress preservation
        run: npx vitest run tests/security/activity-check-route.test.ts
      - name: Simulate concurrent activity progress CAS and insert races
        run: npx vitest run tests/security/activity-progress-concurrent-cas.test.ts
      - name: Verify optional atomic activity receipt source and permission boundary
        run: npx vitest run tests/security/atomic-activity-commit-routing.test.ts
      - name: Verify activity attempt numbering collision retries
        run: npx vitest run tests/security/attempt-number-sequencing.test.ts
      - name: Exercise bounded student activity HTTP route with synthetic requests
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/activity-check-http-runtime.test.ts
      - name: Exercise curriculum admin HTTP gates before private answer reads or repair
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/curriculum-admin-authorization.test.ts tests/security/admin-curriculum-http-authorization.test.ts
      - name: Verify owner-scoped and concurrent-idempotent trusted lesson starts
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/owner-scoped-progress-repository.test.ts tests/security/lesson-progress-idempotent-start.test.ts tests/security/lesson-mastery-score-cas.test.ts
      - name: Verify tutoring cannot award academic mastery
        run: npx vitest run tests/security/tutor-not-mastery.test.ts
      - name: Execute no-network formative grading spoofing and no-persistence tests
        run: npx vitest run --config tests/security/formative-runtime.vitest.config.mts tests/security/formative-grading-no-persistence.test.ts
      - name: Verify immutable assessment completion receipts and safe retries
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/assessment-completion-receipt.test.ts
      - name: Verify trusted skill first-attempt persistence and bounded scores
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/trusted-skill-writes.test.ts
      - name: Recompute student memory only from owned trusted keys and scores
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/verified-student-memory.test.ts
      - name: Enforce server-only AI answer submission progress and memory writes
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/ai-assessment-submit-trusted-progress.test.ts
      - name: Execute real AI assessment-next authenticated step completion tests
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/ai-assessment-next-adaptive-runtime.test.ts
      - name: Verify legacy Gemini assessment generator cannot reach browser bundles
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/legacy-ai-generation-server-only.test.ts
      - name: Confirm AI duplicate hashes stay private after safe column grants
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/ai-assessment-private-hash-runtime.test.ts
      - name: Verify AI assessment keys and authoritative session progression
        run: npx vitest run tests/security/ai-assessment-client-trust.test.ts
      - name: Reject unreadable or foreign assessment session starts
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/assessment-session-start-integrity.test.ts
      - name: Execute no-network adaptive question session authorization and reuse tests
        run: npx vitest run --config tests/security/vitest.config.mts tests/security/ai-assessment-session-generation.test.ts
      - name: Verify AI assessment analytics with mocked trusted keys
        run: npx vitest run tests/security/ai-session-analytics.test.ts
      - name: Index all static assessment table / RPC consumers
        run: node scripts/audit-assessment-consumers.mjs
      - name: Save nonsecret consumer inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assessment-source-consumers
          path: assessment-consumers-ci.json
          retention-days: 3
          if-no-files-found: ignore
      - name: Verify read-only assessment grants audit
        run: npx vitest run tests/security/assessment-grants-audit.test.ts
      - name: Verify public lesson bundle excludes answer keys
        run: npx vitest run tests/security/public-lesson-bundle-rpc.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Start compiled Next.js and smoke-test anonymous runtime
        run: node scripts/smoke-next-production-runtime.mjs

  shadow-question-grants:
    name: Disposable PostgreSQL question grants + rollback
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: disposable-ci-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify activity-progress CAS against disposable PostgreSQL
        shell: bash
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$PG_CONTAINER_ID"
          docker exec "$PG_CONTAINER_ID" createdb -U postgres shadow_activity_cas
          docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_activity_cas \
            < tests/security/shadow-activity-progress-cas.sql
      - name: Rehearse activity attempt unique-number rollout and rollback in shadow Postgres
        shell: bash
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$PG_CONTAINER_ID"
          docker exec "$PG_CONTAINER_ID" createdb -U postgres shadow_activity_sequence
          docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_activity_sequence \
            < tests/security/shadow-activity-sequence-setup.sql
          if output=$( {
              echo "SET dadyoom.attempt_sequence_rehearsal='enabled';"
              cat scripts/security/proposed-activity-attempt-number-uniqueness.sql
            } | docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres 2>&1 ); then
            echo "Attempt uniqueness proposal accepted wrong database" >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'PRODUCTION_ACTIVITY_SEQUENCE_DDL_BLOCKED'
          if output=$(docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_activity_sequence \
              < scripts/security/proposed-activity-attempt-number-uniqueness.sql 2>&1); then
            echo "Attempt uniqueness proposal accepted missing rehearsal flag" >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'PRODUCTION_ACTIVITY_SEQUENCE_DDL_BLOCKED'
          # A genuine legacy duplicate must abort before the unique DDL.
          docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_activity_sequence \
            -c "INSERT INTO lesson_activity_attempts(user_id,activity_id,attempt_number) VALUES ('11111111-1111-4111-8111-111111111111','22222222-2222-4222-8222-222222222222',2)"
          if output=$( {
              echo "SET dadyoom.attempt_sequence_rehearsal='enabled';"
              cat scripts/security/proposed-activity-attempt-number-uniqueness.sql
            } | docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_activity_sequence 2>&1 ); then
            echo "Attempt uniqueness proposal ignored pre-existing duplicates" >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -q 'ACTIVITY_SEQUENCE_PREEXISTING_DUPLICATES'
          docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_activity_sequence \
            -c "DELETE FROM lesson_activity_attempts WHERE id=3"
          {
            echo "SET dadyoom.attempt_sequence_rehearsal='enabled';"
            cat scripts/security/proposed-activity-attempt-number-uniqueness.sql
            cat tests/security/shadow-activity-sequence-verify.sql
          } | docker exec -i "$PG_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d shadow_activity_sequence
          echo "SHADOW_ACTIVITY_SEQUENCE_GUARD_DUPLICATE_ROLLBACK=PASS"
