name: Grade 1-3 original syllabus and Arabic guides integrity

on:
  push:
    branches:
      - fix/student-authorize-before-server-grading-20261022
    paths:
      - 'data/curriculum-drafts/arab21-grades123-word-syllables-original-63-20261029.json'
      - 'data/curriculum-drafts/bahrain-grades123-syllables-three-more-activities-20261029.json'
      - 'tests/curriculum-arab22-grades123-original-word-syllables-66-lessons.test.ts'
      - 'content/learning-guides.ts'
      - 'tests/learning-guides-original.test.ts'
      - '.github/workflows/grade123-original-syllables-guide-quality.yml'
  pull_request:
    paths:
      - 'data/curriculum-drafts/arab21-grades123-word-syllables-original-63-20261029.json'
      - 'data/curriculum-drafts/bahrain-grades123-syllables-three-more-activities-20261029.json'
      - 'tests/curriculum-arab22-grades123-original-word-syllables-66-lessons.test.ts'
      - 'content/learning-guides.ts'
      - 'tests/learning-guides-original.test.ts'
      - '.github/workflows/grade123-original-syllables-guide-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grade123-original-syllables-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-curriculum-quality:
    name: Verify authentic lesson source and private answer separation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked project dependencies without code-generation scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify 66 syllable lessons, six activities each and ten Arabic guides
        run: npx vitest run tests/curriculum-arab22-grades123-original-word-syllables-66-lessons.test.ts tests/learning-guides-original.test.ts
      - name: Typecheck complete feature-branch source (independent of PR merge)
        run: npx tsc --noEmit
      - name: Lint new content, SEO, and ad consent source
        run: npx eslint app/page.tsx app/layout.tsx app/guides/page.tsx 'app/guides/[slug]/page.tsx' app/faq/page.tsx app/opengraph-image.tsx app/sitemap.ts lib/site.ts lib/billing/access.ts components/ads/DadyoomAds.tsx components/privacy/AdConsentPrompt.tsx components/skills/ArabicVoiceCheck.tsx content/learning-guides.ts
      - name: Confirm no direct answer keys appear in public original syllabus source
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const paths=[
            'data/curriculum-drafts/arab21-grades123-word-syllables-original-63-20261029.json',
            'data/curriculum-drafts/bahrain-grades123-syllables-three-more-activities-20261029.json',
          ];
          for(const path of paths){
            const src=readFileSync(path,'utf8');
            for(const key of ['correct_answer','model_answer','explanation','student_id']){
              if(new RegExp('"'+key+'"\\s*:').test(src)){throw new Error('Public file contains private data field: '+key+' in '+path);}
            }
          }
          NODE
