name: Cloudflare Deploy

on:
  push:
    branches:
      - fix/mobile-cloud-video-final-20260923
  workflow_dispatch:

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --legacy-peer-deps --no-package-lock

      - name: Build
        run: npm run build:vinext

      - name: Deploy production when Cloudflare credentials are configured
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "DADYOOM_CLOUDFLARE_DEPLOY=SKIPPED_MISSING_REPOSITORY_SECRETS"
            echo "Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (or CF_API_TOKEN / CF_ACCOUNT_ID)."
            exit 0
          fi

          npm run deploy:vinext
          echo "DADYOOM_CLOUDFLARE_DEPLOY=PASS"

      - name: Verify canonical production commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE: https://dadyoom.dpdns.org
        run: |
          set -euo pipefail

          matched=0
          for attempt in $(seq 1 60); do
            body="$(curl --silent --show-error --max-time 20 "$BASE/api/deploy/version" || true)"
            actual="$(node -e '
              try {
                const body = JSON.parse(process.argv[1]);
                process.stdout.write(String(body.commit || ""));
              } catch {
                process.stdout.write("");
              }
            ' "$body")"

            echo "DEPLOY_VERIFY attempt=$attempt expected=$EXPECTED_SHA actual=$actual"

            if [[ "$actual" == "$EXPECTED_SHA" ]]; then
              matched=1
              break
            fi

            # A continuously changing curriculum branch can supersede a run
            # before external Cloudflare deploy ever serves its SHA. Distinguish
            # that from a broken deploy, and stop consuming runner time.
            # Fail closed: a superseded SHA is NOT a verified deployment.
            if (( attempt >= 3 && attempt % 3 == 0 )); then
              latest="$(git ls-remote --heads origin refs/heads/fix/mobile-cloud-video-final-20260923 | awk '{print $1}' || true)"
              if [[ -n "$latest" && "$latest" != "$EXPECTED_SHA" ]]; then
                echo "DADYOOM_DEPLOY_VERIFY=SUPERSEDED expected=$EXPECTED_SHA latest=$latest observed=$actual"
                echo "::notice title=Superseded production check::A later branch commit replaced $EXPECTED_SHA before production verification. No PASS is claimed."
                exit 1
              fi
            fi

            sleep 10
          done

          if [[ "$matched" != "1" ]]; then
            echo "DADYOOM_DEPLOY_VERIFY=FAIL"
            exit 1
          fi

          echo "DADYOOM_DEPLOY_VERIFY=PASS"

      - name: Verify login and signup static chunks
        env:
          EXPECTED_SHA: ${{ github.sha }}
          DADYOOM_BASE_URL: https://dadyoom.dpdns.org
        run: node scripts/verify-production-auth-assets.mjs
