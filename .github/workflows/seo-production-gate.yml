name: SEO Production Gate

on:
  push:
    branches:
      - fix/mobile-cloud-video-final-20260923
  workflow_dispatch:

concurrency:
  group: seo-production-gate
  cancel-in-progress: true

jobs:
  seo-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve expected SHA
        id: source
        shell: bash
        run: |
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Wait for canonical domain deployment
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          BASE: https://dadyoom.dpdns.org
        run: |
          set -euo pipefail

          matched=0
          for attempt in $(seq 1 60); do
            body="$(curl --silent --show-error --max-time 20 "$BASE/api/deploy/version" || true)"
            actual="$(node -e '
              try {
                const body = JSON.parse(process.argv[1]);
                process.stdout.write(String(body.commit || ""));
              } catch {
                process.stdout.write("");
              }
            ' "$body")"

            echo "SEO_DEPLOY_SYNC attempt=$attempt expected=$EXPECTED_SHA actual=$actual"

            if [[ "$actual" == "$EXPECTED_SHA" ]]; then
              matched=1
              break
            fi

            sleep 10
          done

          if [[ "$matched" != "1" ]]; then
            echo "SEO_DEPLOY_SYNC=FAIL"
            exit 1
          fi

          echo "SEO_DEPLOY_SYNC=PASS"

      - name: Verify canonical homepage, robots and sitemap
        shell: bash
        env:
          BASE: https://dadyoom.dpdns.org
        run: |
          set -euo pipefail

          home="$(mktemp)"
          robots="$(mktemp)"
          sitemap="$(mktemp)"

          home_code="$(curl --silent --show-error --location --max-time 30             --output "$home" --write-out "%{http_code}" "$BASE/")"
          robots_code="$(curl --silent --show-error --location --max-time 30             --output "$robots" --write-out "%{http_code}" "$BASE/robots.txt")"
          sitemap_code="$(curl --silent --show-error --location --max-time 30             --output "$sitemap" --write-out "%{http_code}" "$BASE/sitemap.xml")"

          test "$home_code" = "200"
          test "$robots_code" = "200"
          test "$sitemap_code" = "200"

          grep -Fq "dadyoom.dpdns.org" "$home"
          grep -Fq "Sitemap: $BASE/sitemap.xml" "$robots"
          grep -Fq "<loc>$BASE" "$sitemap"

          if grep -Eq 'dadyoom\.pages\.dev|dadyoom\.mrahmedsamirhamam\.workers\.dev' "$sitemap"; then
            echo "SEO_SITEMAP_LEGACY_HOST=FAIL"
            exit 1
          fi

          url_count="$(grep -o '<loc>' "$sitemap" | wc -l | tr -d ' ')"
          unique_count="$(
            grep -oE '<loc>[^<]+' "$sitemap" |
              sed 's#<loc>##' |
              sort -u |
              wc -l |
              tr -d ' '
          )"
          country_count="$(
            grep -oE '<loc>[^<]+' "$sitemap" |
              sed 's#<loc>##' |
              grep -Ec "^$BASE/curriculum/[a-z]{2}$" || true
          )"
          grade_count="$(
            grep -oE '<loc>[^<]+' "$sitemap" |
              sed 's#<loc>##' |
              grep -Ec "^$BASE/curriculum/[a-z]{2}/[0-9]+$" || true
          )"
          lesson_count="$(
            grep -oE '<loc>[^<]+' "$sitemap" |
              sed 's#<loc>##' |
              grep -c "^$BASE/lessons/" || true
          )"

          # Curriculum authoring expands the quality-filtered SEO lesson view.
          # Preserve duplicate/coverage/crawlability gates; do not cap at 2000.
          # Keep a generous safety ceiling (well below Google's 50k URL limit).
          if (( url_count < 20 || url_count > 12000 )); then
            echo "SEO_SITEMAP_URL_COUNT=FAIL count=$url_count"
            exit 1
          fi

          if [[ "$url_count" != "$unique_count" ]]; then
            echo "SEO_SITEMAP_DUPLICATES=FAIL total=$url_count unique=$unique_count"
            exit 1
          fi

          if [[ "$country_count" != "22" ]]; then
            echo "SEO_SITEMAP_COUNTRIES=FAIL count=$country_count"
            exit 1
          fi

          if (( grade_count < 1 || grade_count > 300 )); then
            echo "SEO_SITEMAP_GRADES=FAIL count=$grade_count"
            exit 1
          fi

          if (( lesson_count < 100 || lesson_count > 10000 )); then
            echo "SEO_SITEMAP_LESSONS=FAIL count=$lesson_count"
            exit 1
          fi

          echo "SEO_CANONICAL_HOME=PASS"
          echo "SEO_ROBOTS=PASS"
          echo "SEO_SITEMAP=PASS count=$url_count"

      - name: Verify sitemap sample is crawlable
        shell: bash
        env:
          BASE: https://dadyoom.dpdns.org
        run: |
          set -euo pipefail

          sitemap="$(curl --silent --show-error --location --max-time 30 "$BASE/sitemap.xml")"

          mapfile -t urls < <(
            {
              printf '%s' "$sitemap" |
                grep -oE '<loc>[^<]+' |
                sed 's#<loc>##' |
                sed -n '1,20p'

              printf '%s' "$sitemap" |
                grep -oE '<loc>[^<]+' |
                sed 's#<loc>##' |
                grep '/lessons/' |
                sed -n '1,20p'
            } |
              awk '!seen[$0]++'
          )

          if (( ${#urls[@]} == 0 )); then
            echo "SEO_SITEMAP_SAMPLE=FAIL_EMPTY"
            exit 1
          fi

          for url in "${urls[@]}"; do
            code="$(curl --silent --show-error --max-time 30               --output /dev/null --write-out "%{http_code}"               -H "User-Agent: Googlebot" "$url")"

            echo "SEO_SAMPLE url=$url http=$code"

            if [[ "$code" != "200" ]]; then
              echo "SEO_SITEMAP_SAMPLE=FAIL url=$url http=$code"
              exit 1
            fi
          done

          echo "SEO_SITEMAP_SAMPLE=PASS checked=${#urls[@]}"

      - name: Verify Googlebot page metadata
        shell: bash
        env:
          BASE: https://dadyoom.dpdns.org
        run: |
          set -euo pipefail

          check_page() {
            path="$1"
            expected_title="$2"
            expected_canonical="$3"

            html="$(curl --silent --show-error --location --max-time 30               -H "User-Agent: Googlebot" "$BASE$path")"

            if ! grep -Fq "<title>$expected_title" <<<"$html"; then
              echo "SEO_PAGE_TITLE=FAIL path=$path expected=$expected_title"
              exit 1
            fi

            if ! grep -Fq "href=\"$BASE$expected_canonical\"" <<<"$html"; then
              echo "SEO_PAGE_CANONICAL=FAIL path=$path expected=$BASE$expected_canonical"
              exit 1
            fi

            if ! grep -Eiq '<meta[^>]+name="robots"[^>]+content="[^"]*index[^"]*follow' <<<"$html"; then
              echo "SEO_PAGE_ROBOTS=FAIL path=$path"
              exit 1
            fi

            echo "SEO_PAGE_METADATA=PASS path=$path"
          }

          check_page "/about" "عن ضاديوم | منصة تعليم العربية ومناهجها" "/about"
          check_page "/courses" "مناهج اللغة العربية" "/courses"
          check_page "/teachers" "أدوات المعلم الذكية | تحضير الدروس وأوراق العمل" "/teachers"
          check_page "/curriculum/bh" "مناهج اللغة العربية في البحرين" "/curriculum/bh"

          bahrain_app_html="$(curl --silent --show-error --location --max-time 30 \
            -H "User-Agent: Googlebot" "$BASE/bahrain")"

          if ! grep -Fq "href=\"$BASE/curriculum/bh\"" <<<"$bahrain_app_html"; then
            echo "SEO_BAHRAIN_APP_CANONICAL=FAIL"
            exit 1
          fi

          if ! grep -Eiq '<meta[^>]+name="robots"[^>]+content="[^"]*noindex[^"]*follow' <<<"$bahrain_app_html"; then
            echo "SEO_BAHRAIN_APP_NOINDEX=FAIL"
            exit 1
          fi

          echo "SEO_BAHRAIN_APP_CONSOLIDATION=PASS"

      - name: Verify all country landing pages
        shell: bash
        env:
          BASE: https://dadyoom.dpdns.org
        run: |
          set -euo pipefail

          sitemap="$(curl --silent --show-error --location --max-time 30 "$BASE/sitemap.xml")"

          mapfile -t country_urls < <(
            printf '%s' "$sitemap" |
              grep -oE '<loc>[^<]+' |
              sed 's#<loc>##' |
              grep -E "^$BASE/curriculum/[a-z]{2}$"
          )

          if [[ "${#country_urls[@]}" != "22" ]]; then
            echo "SEO_COUNTRY_PAGES=FAIL_COUNT count=${#country_urls[@]}"
            exit 1
          fi

          for url in "${country_urls[@]}"; do
            html="$(mktemp)"
            code="$(curl --silent --show-error --max-time 30               --output "$html" --write-out "%{http_code}"               -H "User-Agent: Googlebot" "$url")"

            if [[ "$code" != "200" ]]; then
              echo "SEO_COUNTRY_PAGE=FAIL_HTTP url=$url http=$code"
              exit 1
            fi

            if ! grep -Fq "href=\"$url\"" "$html"; then
              echo "SEO_COUNTRY_PAGE=FAIL_CANONICAL url=$url"
              exit 1
            fi

            if grep -Eiq '<meta[^>]+name="robots"[^>]+content="[^"]*noindex' "$html"; then
              echo "SEO_COUNTRY_PAGE=FAIL_NOINDEX url=$url"
              exit 1
            fi

            if grep -Eq 'dadyoom\.pages\.dev|dadyoom\.mrahmedsamirhamam\.workers\.dev' "$html"; then
              echo "SEO_COUNTRY_PAGE=FAIL_LEGACY_HOST url=$url"
              exit 1
            fi

            if grep -Fq "الصف 0" "$html"; then
              echo "SEO_COUNTRY_PAGE=FAIL_NONSTANDARD_AS_GRADE_ZERO url=$url"
              exit 1
            fi

            echo "SEO_COUNTRY_PAGE=PASS url=$url"
          done

          echo "SEO_COUNTRY_PAGES=PASS count=${#country_urls[@]}"

      - name: Verify distributed grade and lesson metadata
        shell: bash
        env:
          BASE: https://dadyoom.dpdns.org
        run: |
          set -euo pipefail

          sitemap="$(curl --silent --show-error --location --max-time 30 "$BASE/sitemap.xml")"

          mapfile -t grade_urls < <(
            printf '%s' "$sitemap" |
              grep -oE '<loc>[^<]+' |
              sed 's#<loc>##' |
              grep -E "^$BASE/curriculum/[a-z]{2}/[0-9]+$" |
              awk 'NR == 1 || NR % 10 == 0'
          )

          mapfile -t lesson_urls < <(
            printf '%s' "$sitemap" |
              grep -oE '<loc>[^<]+' |
              sed 's#<loc>##' |
              grep "^$BASE/lessons/" |
              awk 'NR == 1 || NR % 100 == 0'
          )

          check_indexable_url() {
            url="$1"
            kind="$2"
            html="$(mktemp)"

            code="$(curl --silent --show-error --max-time 30               --output "$html" --write-out "%{http_code}"               -H "User-Agent: Googlebot" "$url")"

            if [[ "$code" != "200" ]]; then
              echo "SEO_DISTRIBUTED=FAIL_HTTP kind=$kind url=$url http=$code"
              exit 1
            fi

            if ! grep -Fq "rel=\"canonical\"" "$html" ||
               ! grep -Fq "href=\"$url\"" "$html"; then
              echo "SEO_DISTRIBUTED=FAIL_CANONICAL kind=$kind url=$url"
              exit 1
            fi

            if ! grep -Eiq '<title>[^<]+' "$html"; then
              echo "SEO_DISTRIBUTED=FAIL_TITLE kind=$kind url=$url"
              exit 1
            fi

            if ! grep -Eiq '<meta[^>]+name="description"[^>]+content="[^"]+' "$html"; then
              echo "SEO_DISTRIBUTED=FAIL_DESCRIPTION kind=$kind url=$url"
              exit 1
            fi

            if grep -Eiq '<meta[^>]+name="robots"[^>]+content="[^"]*noindex' "$html"; then
              echo "SEO_DISTRIBUTED=FAIL_NOINDEX kind=$kind url=$url"
              exit 1
            fi

            if grep -Eq 'dadyoom\.pages\.dev|dadyoom\.mrahmedsamirhamam\.workers\.dev' "$html"; then
              echo "SEO_DISTRIBUTED=FAIL_LEGACY_HOST kind=$kind url=$url"
              exit 1
            fi

            echo "SEO_DISTRIBUTED=PASS kind=$kind url=$url"
          }

          if (( ${#grade_urls[@]} == 0 || ${#lesson_urls[@]} == 0 )); then
            echo "SEO_DISTRIBUTED=FAIL_EMPTY_SAMPLE"
            exit 1
          fi

          for url in "${grade_urls[@]}"; do
            check_indexable_url "$url" "grade"
          done

          for url in "${lesson_urls[@]}"; do
            check_indexable_url "$url" "lesson"
          done

          echo "SEO_DISTRIBUTED=PASS grades=${#grade_urls[@]} lessons=${#lesson_urls[@]}"

      - name: Verify one indexable lesson metadata
        shell: bash
        env:
          BASE: https://dadyoom.dpdns.org
        run: |
          set -euo pipefail

          sitemap="$(curl --silent --show-error --location --max-time 30 "$BASE/sitemap.xml")"
          lesson_url="$(
            printf '%s' "$sitemap" |
              grep -oE '<loc>[^<]+' |
              sed 's#<loc>##' |
              grep '/lessons/' |
              sed -n '1p'
          )"

          if [[ -z "$lesson_url" ]]; then
            echo "SEO_LESSON_METADATA=FAIL_NO_LESSON"
            exit 1
          fi

          html="$(curl --silent --show-error --location --max-time 30             -H "User-Agent: Googlebot" "$lesson_url")"

          if ! grep -Fq 'rel="canonical"' <<<"$html"; then
            echo "SEO_LESSON_METADATA=FAIL_CANONICAL url=$lesson_url"
            exit 1
          fi

          if grep -Eiq '<meta[^>]+name="robots"[^>]+content="[^"]*noindex' <<<"$html"; then
            echo "SEO_LESSON_METADATA=FAIL_NOINDEX url=$lesson_url"
            exit 1
          fi

          echo "SEO_LESSON_METADATA=PASS url=$lesson_url"

      - name: Submit sitemap to IndexNow
        shell: bash
        env:
          DADYOOM_INDEXNOW_SITE: https://dadyoom.dpdns.org
        run: |
          set -euo pipefail
          node scripts/submit-indexnow.mjs

      - name: Verify legacy public hosts consolidate to canonical
        shell: bash
        run: |
          set -euo pipefail

          for legacy in             "https://dadyoom.mrahmedsamirhamam.workers.dev/"             "https://dadyoom.pages.dev/"; do

            headers="$(mktemp)"
            code="$(curl --silent --show-error --max-time 30               --output /dev/null --dump-header "$headers"               --write-out "%{http_code}" "$legacy")"

            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$headers")"

            echo "SEO_LEGACY_REDIRECT host=$legacy http=$code location=$location"

            if [[ "$code" != "308" ]]; then
              echo "SEO_LEGACY_REDIRECT=FAIL_STATUS host=$legacy"
              exit 1
            fi

            if [[ "$location" != "https://dadyoom.dpdns.org/" ]]; then
              echo "SEO_LEGACY_REDIRECT=FAIL_LOCATION host=$legacy location=$location"
              exit 1
            fi
          done

          echo "SEO_LEGACY_REDIRECT=PASS"
