name: Cloudflare Worker bundle build (isolated, no deploy)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cloudflare-worker-bundle-ci.yml'
      - 'app/**'
      - 'features/**'
      - 'components/**'
      - 'lib/**'
      - 'types/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'cloudflare.config.ts'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'scripts/smoke-cloudflare-worker-runtime.mjs'

permissions:
  contents: read

jobs:
  cloudflare-bundle-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      DADYOOM_WORKER_BUILD: '1'
      # Fake, non-routable public client config only for anonymous local Worker tests.
      # No actual Supabase project, tokens, student account or admin key used.
      NEXT_PUBLIC_SUPABASE_URL: 'https://dadyoom-ci.invalid'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'not-a-real-supabase-key-for-ci'
      # Intentionally no CLOUDFLARE_API_TOKEN, ACCOUNT_ID, database or app secrets.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install unchanged application dependencies
        run: npm ci --no-audit --no-fund
      - name: Test React runtime compatibility only in disposable CI checkout
        shell: bash
        run: |
          set -euo pipefail
          # Do not change tracked package.json or package-lock in GitHub.
          # vinext 1.3.x requires React >=19.3.1, whereas production uses 19.2.4.
          # Temporarily validate the React 19.3.1 combination, NOT an endorsed upgrade.
          node <<'JS'
          const fs=require('node:fs');
          const path='package.json';
          const pkg=JSON.parse(fs.readFileSync(path,'utf8'));
          pkg.dependencies.react='19.3.1';
          pkg.dependencies['react-dom']='19.3.1';
          pkg.dependencies['react-server-dom-webpack']='19.3.1';
          fs.writeFileSync(path,JSON.stringify(pkg,null,2)+'\n');
          JS
          npm install --no-save --package-lock=false --no-audit --no-fund vinext@1.3.0
          node -e 'const r=require("react/package.json"), v=require("./node_modules/vinext/package.json"); console.log("EPHEMERAL_REACT_VERSION="+r.version); console.log("EPHEMERAL_VINEXT_VERSION="+v.version);'
      - name: Verify the exact tested Cloudflare configs are committed
        shell: bash
        run: |
          set -euo pipefail
          test -f vite.config.ts
          test -f cloudflare.config.ts
          test -f next.config.ts
          grep -q 'import vinext from "vinext"' vite.config.ts
          grep -q 'import { bindings, defineConfig, defineWorker } from "cf/config"' cloudflare.config.ts
          grep -q 'DADYOOM_WORKER_BUILD' next.config.ts
          # No production account/secret is read during this isolated build.
          echo "CLOUDFLARE_COMMITTED_SOURCE_CONFIG=PASS"

      - name: Install Cloudflare-only build adapters using explicit versions
        shell: bash
        run: |
          set -euo pipefail
          # No 'vinext init' package-manager side effects. Keep all
          # dependencies in the ephemeral runner, not in GitHub's source.
          npm install --no-save --package-lock=false --no-audit --no-fund \
            vinext@1.3.0 @vinext/cloudflare@1.2.0 \
            vite@8.3.0 @vitejs/plugin-react@6.1.2 @vitejs/plugin-rsc@0.5.38 \
            @cloudflare/vite-plugin@beta cf@latest \
            @babel/plugin-transform-runtime@7.29.0 \
            react-server-dom-webpack@19.3.1
      - name: Build actual Worker bundle (no deploy, no cloud credentials)
        shell: bash
        run: |
          set -euo pipefail
          npx vinext build 2>&1 | tee worker-build.log
      - name: Require a generated Cloudflare Worker bundle
        shell: bash
        run: |
          set -euo pipefail
          echo "Generated Worker files (filenames only):"
          find dist .cloudflare -maxdepth 4 -type f 2>/dev/null | head -60 || true
          test -d .cloudflare/output/v0/workers/default/bundle
          test -f .cloudflare/output/v0/workers/default/bundle/ssr/index.js
          test -f .cloudflare/output/v0/config.json
          echo "CLOUDFLARE_WORKER_BUNDLE_BUILD=PASS"
      - name: Validate Cloudflare prebuilt deployment completely offline
        shell: bash
        run: |
          set -euo pipefail
          # Per Cloudflare's cf docs, --dry-run makes NO API requests
          # and requires no Cloudflare credentials or paid services.
          # --prebuilt validates the exact Worker build made above.
          npx cf deploy --prebuilt --mode production --dry-run \
            2>&1 | tee worker-deploy-dry-run.log
          echo "CLOUDFLARE_PREBUILT_DEPLOY_DRY_RUN=PASS"
      - name: Install Chromium for read-only mobile and desktop form smoke
        shell: bash
        run: |
          set -euo pipefail
          # Hosted Ubuntu already has Chromium runtime libraries; download only the headless shell.
          # Avoid flaky apt-get install/update from --with-deps on each CI run.
          npx playwright install --only-shell chromium
      - name: Smoke-test generated Worker in local workerd via Vite preview
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smoke-cloudflare-worker-runtime.mjs 2>&1 | tee worker-runtime-smoke.log
      - name: Save nonsecret diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-cloudflare-worker-build-report
          path: |
            worker-build.log
            worker-runtime-smoke.log
            worker-deploy-dry-run.log
          retention-days: 3
          if-no-files-found: ignore
