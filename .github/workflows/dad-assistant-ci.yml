name: Dadyoom smart assistant quality

on:
  pull_request:
    paths:
      - 'app/(dashboard)/ask/**'
      - 'app/api/dad/chat/**'
      - 'app/lessons/**/page.tsx'
      - 'lib/ai/assistant-modes.ts'
      - 'lib/ai/assistant-request.ts'
      - 'lib/mobile/hybrid-ai.ts'
      - 'lib/mobile/assistant-fallback.ts'
      - 'tests/assistant-fallback.test.ts'
      - 'tests/assistant-modes.test.ts'
      - 'tests/assistant-request.test.ts'
      - 'tests/assistant-route.test.ts'
      - '.github/workflows/dad-assistant-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dad-assistant-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate assistant request and educational guidance
        run: npm run test:run -- tests/assistant-modes.test.ts tests/assistant-request.test.ts tests/assistant-route.test.ts tests/assistant-fallback.test.ts
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Check ESLint
        run: npm run lint
      - name: Build Next.js
        run: npm run build
