name: Native Mobile Build

on:
  workflow_dispatch:
    inputs:
      publish_android_release:
        description: "Publish the permanently signed Android APK as a GitHub Release"
        required: false
        type: boolean
        default: false
      version_name:
        description: "Android version name"
        required: false
        default: "1.0.0"
      version_code:
        description: "Android version code"
        required: false
        default: "1"
      build_android:
        description: "Build Android during manual dispatch"
        required: false
        type: boolean
        default: true
      build_ios:
        description: "Also rebuild iOS during manual dispatch"
        required: false
        type: boolean
        default: false
      ios_sign_ad_hoc:
        description: "Sign iOS for registered iPhone devices using Apple Ad Hoc provisioning"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - fix/mobile-cloud-video-final-20260923
    paths:
      - "capacitor.config.ts"
      - "mobile-shell/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/dadyoom-ci-build-android-native.sh"
      - "scripts/dadyoom-ci-build-ios-native.sh"
      - ".github/workflows/native-mobile-build.yml"

permissions:
  contents: write

jobs:
  android-native:
    name: Android native APK
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DADYOOM_ANDROID_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
      DADYOOM_ANDROID_VERSION_CODE: ${{ inputs.version_code || '1' }}
      DADYOOM_ANDROID_MODEL_URL: ${{ secrets.DADYOOM_ANDROID_MODEL_URL }}
      DADYOOM_ANDROID_KEYSTORE_B64: ${{ secrets.DADYOOM_ANDROID_KEYSTORE_B64 }}
      DADYOOM_ANDROID_STORE_PASSWORD: ${{ secrets.DADYOOM_ANDROID_STORE_PASSWORD }}
      DADYOOM_ANDROID_KEY_PASSWORD: ${{ secrets.DADYOOM_ANDROID_KEY_PASSWORD }}
      DADYOOM_ANDROID_KEY_ALIAS: ${{ secrets.DADYOOM_ANDROID_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME"

      - name: Build native Android with offline Qwen
        run: bash scripts/dadyoom-ci-build-android-native.sh

      - name: Upload Android native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dadyoom-android-native
          path: .dadyoom-mobile/ci/android/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish signed Android release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_android_release && hashFiles('.dadyoom-mobile/ci/android/Dadyoom-Android-release.apk') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dadyoom-mobile-v${DADYOOM_ANDROID_VERSION_NAME}"
          APK=".dadyoom-mobile/ci/android/Dadyoom-Android-release.apk"
          VERSIONED=".dadyoom-mobile/ci/android/Dadyoom-Android-${DADYOOM_ANDROID_VERSION_NAME}-release.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" \
            "$APK#Dadyoom Android ${DADYOOM_ANDROID_VERSION_NAME}" \
            "$VERSIONED#Versioned Android APK" \
            --target "$GITHUB_SHA" \
            --title "Dadyoom Android ${DADYOOM_ANDROID_VERSION_NAME}" \
            --notes "Native Android release for direct installation from Dadyoom. Includes the offline Qwen2.5 1.5B q8 model." \
            --latest

          echo "ANDROID_PUBLIC_RELEASE=PASS"
          echo "ANDROID_PUBLIC_APK_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/Dadyoom-Android-release.apk"

  ios-native:
    name: iOS native app
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_ios }}
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      DADYOOM_IOS_MODEL_URL: ${{ secrets.DADYOOM_IOS_MODEL_URL }}
      DADYOOM_IOS_SIGN_AD_HOC: ${{ inputs.ios_sign_ad_hoc && '1' || '0' }}
      DADYOOM_IOS_CERTIFICATE_P12_BASE64: ${{ secrets.DADYOOM_IOS_CERTIFICATE_P12_BASE64 }}
      DADYOOM_IOS_CERTIFICATE_PASSWORD: ${{ secrets.DADYOOM_IOS_CERTIFICATE_PASSWORD }}
      DADYOOM_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.DADYOOM_IOS_PROVISIONING_PROFILE_BASE64 }}
      DADYOOM_IOS_TEAM_ID: ${{ secrets.DADYOOM_IOS_TEAM_ID }}
      DADYOOM_IOS_SIGNING_IDENTITY: ${{ secrets.DADYOOM_IOS_SIGNING_IDENTITY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install Apple Ad Hoc signing assets
        if: ${{ inputs.ios_sign_ad_hoc }}
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "$DADYOOM_IOS_CERTIFICATE_P12_BASE64" ]] || { echo "FAILED=IOS_CERTIFICATE_SECRET_MISSING"; exit 1; }
          [[ -n "$DADYOOM_IOS_CERTIFICATE_PASSWORD" ]] || { echo "FAILED=IOS_CERTIFICATE_PASSWORD_SECRET_MISSING"; exit 1; }
          [[ -n "$DADYOOM_IOS_PROVISIONING_PROFILE_BASE64" ]] || { echo "FAILED=IOS_PROVISIONING_PROFILE_SECRET_MISSING"; exit 1; }
          [[ -n "$DADYOOM_IOS_TEAM_ID" ]] || { echo "FAILED=IOS_TEAM_ID_SECRET_MISSING"; exit 1; }

          KEYCHAIN_PATH="$RUNNER_TEMP/dadyoom-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/dadyoom-ios-signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/dadyoom.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/dadyoom-profile.plist"

          printf '%s' "$DADYOOM_IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$DADYOOM_IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$DADYOOM_IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          PROFILE_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"

          [[ "$PROFILE_TEAM" == "$DADYOOM_IOS_TEAM_ID" ]] || {
            echo "FAILED=IOS_PROFILE_TEAM_MISMATCH profile=$PROFILE_TEAM secret=$DADYOOM_IOS_TEAM_ID"
            exit 1
          }

          [[ "$PROFILE_APP_ID" == "$DADYOOM_IOS_TEAM_ID.com.dadyoom.app" ]] || {
            echo "FAILED=IOS_PROFILE_APP_ID_MISMATCH profile=$PROFILE_APP_ID expected=$DADYOOM_IOS_TEAM_ID.com.dadyoom.app"
            exit 1
          }

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          {
            echo "DADYOOM_IOS_PROFILE_UUID=$PROFILE_UUID"
            echo "DADYOOM_IOS_PROFILE_NAME=$PROFILE_NAME"
            echo "DADYOOM_IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"

          echo "IOS_SIGNING_ASSETS=PASS"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME"
          echo "IOS_PROFILE_UUID=$PROFILE_UUID"
          echo "IOS_PROFILE_TEAM=$PROFILE_TEAM"

      - name: Build native iOS with offline Qwen device resource
        run: bash scripts/dadyoom-ci-build-ios-native.sh

      - name: Upload iOS native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dadyoom-ios-native
          path: .dadyoom-mobile/ci/ios/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
