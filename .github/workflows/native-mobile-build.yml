name: Native Mobile Build

on:
  workflow_dispatch:
  push:
    branches:
      - fix/mobile-cloud-video-final-20260923
    paths:
      - "capacitor.config.ts"
      - "mobile-shell/**"
      - "lib/mobile/**"
      - "components/mobile/**"
      - "app/**"
      - "package.json"
      - "scripts/dadyoom-ci-build-android-native.sh"
      - "scripts/dadyoom-ci-build-ios-native.sh"
      - ".github/workflows/native-mobile-build.yml"

jobs:
  android-native:
    name: Android native APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Build native Android
        run: bash scripts/dadyoom-ci-build-android-native.sh

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: dadyoom-android-native
          path: .dadyoom-mobile/ci/android/
          if-no-files-found: error
          retention-days: 14

  ios-native:
    name: iOS native app
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build native iOS
        env:
          DADYOOM_IOS_MODEL_URL: ${{ secrets.DADYOOM_IOS_MODEL_URL }}
        run: bash scripts/dadyoom-ci-build-ios-native.sh

      - name: Upload iOS native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dadyoom-ios-native
          path: .dadyoom-mobile/ci/ios/
          if-no-files-found: error
          retention-days: 14
