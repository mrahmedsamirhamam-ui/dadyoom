name: P0 atomic role approval (disposable PostgreSQL only)
on:
  push:
    branches:
      - fix/p0-guards-grades-arabic-ui-20261107
  pull_request:
    paths:
      - 'docs/security/REVIEW_ONLY_P0_ATOMIC_ROLE_APPROVAL_2026-11-07.sql'
      - 'tests/sql/atomic-role-review-p0.sql'
      - '.github/workflows/p0-atomic-role-review-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: review_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d review_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: disposable-only
      PGDATABASE: review_test
    steps:
      - uses: actions/checkout@v4
      - name: Install postgres client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Simulate Supabase RBAC roles with no actual user data
        run: psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE service_role NOLOGIN BYPASSRLS;'
      - name: Prepare synthetic auth + profiles fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/fixtures/auth-profile-role-postgres-setup.sql
      - name: Apply existing review-only role constraints
        run: psql -v ON_ERROR_STOP=1 -f docs/security/REVIEW_ONLY_ROLE_APPROVAL_AND_RLS_2026-11-06.sql
      - name: Apply atomic approval proposal in disposable DB
        run: psql -v ON_ERROR_STOP=1 -f docs/security/REVIEW_ONLY_P0_ATOMIC_ROLE_APPROVAL_2026-11-07.sql
      - name: Test forged reviewer, status consistency, double approval and rejection
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/atomic-role-review-p0.sql
