name: Homepage mobile dock
on:
  pull_request:
    paths:
      - "app/page.tsx"
      - "app/globals.css"
      - "components/pwa/DadyoomInstallPrompt.tsx"
      - "components/dad-ai/DadCompanion.tsx"
      - "components/home/HomeFloatingGuard.tsx"
      - "components/home/HomeInteractionPanel.tsx"
      - "components/home/HomeTrustStrip.tsx"
      - "tests/home-mobile-floating-dock.test.ts"
      - "scripts/smoke-home-mobile-dock.mjs"
      - ".github/workflows/home-mobile-dock-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run tests/home-mobile-floating-dock.test.ts
      - run: npm run test:run
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx eslint app/page.tsx components/pwa/DadyoomInstallPrompt.tsx components/dad-ai/DadCompanion.tsx tests/home-mobile-floating-dock.test.ts
      - run: npm run build
      - name: Check curated home source
        run: npx eslint components/home/HomeTrustStrip.tsx app/page.tsx tests/home-mobile-floating-dock.test.ts
      - name: Chrome 360 / 390 / 430 smoke
        shell: bash
        run: |
          npm run start -- -p 3033 >/tmp/dadyoom-home.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:3033/ >/dev/null; then break; fi
            sleep 2
          done
          node scripts/smoke-home-mobile-dock.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-mobile-review-screenshots
          path: artifacts/home/
          if-no-files-found: ignore
