name: Curriculum importer data integrity

on:
  pull_request:
    paths:
      - 'scripts/import-curriculum-pack.mjs'
      - 'lib/curriculum-packs/import-safety.mjs'
      - 'lib/curriculum-packs/validate.mjs'
      - 'tests/curriculum-import-integrity.test.ts'
      - '.github/workflows/curriculum-import-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Verify all curriculum source packs
        run: npm run curriculum:verify
      - name: Exercise importer backup and unit-identifier safeguards
        run: npm run test:run -- tests/curriculum-import-integrity.test.ts tests/curriculum-coverage.test.ts
      - name: Exercise actual validated curriculum import as no-write dry run
        run: node scripts/import-curriculum-pack.mjs --pack data/curriculum-packs/bh-2026-arabic-primary-g1-s1.json
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
