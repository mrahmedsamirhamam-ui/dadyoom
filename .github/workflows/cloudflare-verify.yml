name: Cloudflare Verify

on:
  push:
    branches:
      - deploy/cloudflare-vinext-v1
      - fix/mobile-cloud-video-final-20260923
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:run

      - name: Official 22-country launch gate
        run: npm run curriculum:gate:official-22

      - name: Secondary tracks 22-country gate
        run: npm run curriculum:audit:secondary-tracks

      - name: Vinext build
        run: npm run build:vinext

      - name: Verify packaged browser chunks
        run: node scripts/verify-built-client-bundle.mjs

      - name: Build metadata gate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! grep -Fq "$EXPECTED_SHA" generated/build-info.ts; then
            echo "DADYOOM_BUILD_COMMIT=FAIL"
            cat generated/build-info.ts
            exit 1
          fi
          echo "DADYOOM_BUILD_COMMIT=PASS"
