name: Cloudflare Verify

on:
  push:
    branches:
      - deploy/cloudflare-vinext-v1
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:run

      - name: Curriculum packs
        run: npm run curriculum:verify

      - name: Vinext build
        run: npm run build:vinext
