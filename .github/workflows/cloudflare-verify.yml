name: Cloudflare Verify

on:
  push:
    branches:
      - deploy/cloudflare-vinext-v1
      - fix/mobile-cloud-video-final-20260923
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:run

      - name: Official 22-country launch gate
        run: npm run curriculum:gate:official-22

      - name: Vinext build
        run: npm run build:vinext

      - name: Build metadata gate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BODY="$(cat public/app-version.json)"
          echo "$BODY"
          node -e '
            const body = JSON.parse(process.argv[1]);
            const expected = process.env.EXPECTED_SHA;
            if (!body.commit || body.commit !== expected) {
              console.error("DADYOOM_BUILD_COMMIT=FAIL");
              console.error("EXPECTED=" + expected);
              console.error("ACTUAL=" + String(body.commit || ""));
              process.exit(1);
            }
            console.log("DADYOOM_BUILD_COMMIT=PASS");
          ' "$BODY"
