name: Adaptive Arabic grammar sample
on:
  pull_request:
    paths:
      - "lib/adaptive-lessons/**"
      - "components/lesson/HalAdaptiveLesson.tsx"
      - "app/labs/hal-adaptive/**"
      - "tests/adaptive-hal.test.ts"
      - "scripts/smoke-adaptive-hal.mjs"
      - ".github/workflows/adaptive-hal-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run tests/adaptive-hal.test.ts
      - run: npx tsc --noEmit
      - run: npx eslint lib/adaptive-lessons/hal.ts components/lesson/HalAdaptiveLesson.tsx app/labs/hal-adaptive/page.tsx tests/adaptive-hal.test.ts
      - run: npm run build
      - name: Chrome three-width full learning flow
        shell: bash
        run: |
          npm run start -- -p 3033 >/tmp/dadyoom-adaptive.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:3033/labs/hal-adaptive >/dev/null; then break; fi
            sleep 2
          done
          node scripts/smoke-adaptive-hal.mjs
