name: Dadyoom Arabic UI and P0 authorization/grade gates

on:
  push:
    branches:
      - fix/arabic-ui-qa-and-security-review-20261107
  pull_request:
    paths:
      - 'lib/arabic/**'
      - 'lib/auth/profile-role-policy.*'
      - 'lib/security/answer-payload.*'
      - 'app/api/auth/**'
      - 'app/api/questions/answer/route.ts'
      - 'app/api/assessments/check/route.ts'
      - 'app/auth/callback/route.ts'
      - 'app/onboarding/page.tsx'
      - 'components/auth/**'
      - 'proxy.ts'
      - 'tests/arabic-ui-counts.node.test.mjs'
      - 'tests/security/*.node.test.mjs'
      - 'docs/security/STAGING_ONLY_*.sql'
      - '.github/workflows/arabic-p0-security-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linguistic-security-regression:
    name: Arabic counts, roles and grade-source security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Arabic numeral grammar and P0 security-contract tests
        run: node --test tests/arabic-ui-counts.node.test.mjs tests/security/profile-role-boundaries.node.test.mjs tests/security/answer-payload-guard.node.test.mjs tests/security/legacy-grade-stop-ship.node.test.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript strict check
        run: npx tsc --noEmit
      - name: ESLint changed Arabic and security source
        run: >-
          npx eslint
          'app/(dashboard)/teacher/page.tsx'
          'app/(dashboard)/student/page.tsx'
          'app/(dashboard)/school/page.tsx'
          'app/(dashboard)/parent/page.tsx'
          'app/(dashboard)/courses/CurriculumCatalogClient.tsx'
          app/page.tsx
          components/home/HomeInteractionPanel.tsx
          components/auth/EmailPasswordAuthForm.tsx
          components/auth/ProfileOnboardingForm.tsx
          app/onboarding/page.tsx
          app/auth/callback/route.ts
          app/api/auth/complete-profile/route.ts
          app/api/auth/oauth-intent/route.ts
          app/api/questions/answer/route.ts
          app/api/assessments/check/route.ts
          proxy.ts
