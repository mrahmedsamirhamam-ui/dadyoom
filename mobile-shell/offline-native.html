<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#123f39" />
  <title>ضاديوم — ضاد المحلي</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fbf6ea;color:#173f39;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{min-height:100vh;padding:max(24px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));display:flex;justify-content:center}
    .card{width:min(720px,100%);align-self:flex-start;background:#fff;border:1px solid #dfcda4;border-radius:30px;padding:24px;box-shadow:0 18px 55px #00000012}
    .badge{display:inline-block;border-radius:999px;background:#e5f3ed;color:#176047;padding:7px 12px;font-size:12px;font-weight:900}
    h1{margin:14px 0 6px;font-size:30px}.lead{color:#625b50;line-height:1.9;margin:0}
    textarea{width:100%;min-height:130px;margin-top:18px;border:1px solid #d8c7a6;border-radius:18px;padding:14px;font:inherit;line-height:1.8;resize:vertical}
    button{width:100%;border:0;border-radius:17px;padding:14px 18px;font-weight:900;font-size:16px;cursor:pointer}
    #ask{margin-top:10px;background:#123f39;color:white}#retry{margin-top:10px;background:#f3ead8;color:#123f39;border:1px solid #d4bd88}
    button:disabled{opacity:.55;cursor:default}.status{margin-top:14px;padding:13px 14px;border-radius:16px;background:#fff7e8;color:#66583e;font-weight:750;line-height:1.7}
    .answer{margin-top:14px;padding:16px;border-radius:18px;background:#edf8f3;white-space:pre-wrap;line-height:1.9;display:none}
    .note{margin-top:16px;font-size:12px;color:#7a7164;line-height:1.8}
  </style>
</head>
<body>
<main>
  <section class="card">
    <span class="badge">بدون إنترنت · Offline Native</span>
    <h1>ضاد المحلي</h1>
    <p class="lead">تعذر الوصول إلى خادم ضاديوم، لكن نموذج Qwen المدمج داخل التطبيق ما زال متاحًا للمساعدة في العربية دون API.</p>
    <textarea id="question" placeholder="مثال: أعرب الجملة: ذهب محمد إلى السوق."></textarea>
    <button id="ask" type="button">اسأل ضاد المحلي</button>
    <button id="retry" type="button">إعادة الاتصال بضاديوم</button>
    <div id="status" class="status">جارٍ فحص نموذج ضاد المحلي…</div>
    <div id="answer" class="answer"></div>
    <p class="note">عند عودة الإنترنت استخدم زر إعادة الاتصال للعودة إلى الدروس والحساب والمزامنة. الإجابة هنا تُولَّد على الهاتف نفسه.</p>
  </section>
</main>
<script>
(function(){
  "use strict";
  var MODEL="/android_asset/dadyoom-qwen2.5-1.5b-instruct-q8.task";
  var status=document.getElementById("status");
  var answer=document.getElementById("answer");
  var ask=document.getElementById("ask");
  var question=document.getElementById("question");
  var retry=document.getElementById("retry");
  var readyPromise=null;

  function plugin(){
    var cap=window.Capacitor;
    return cap && cap.Plugins ? cap.Plugins.CapgoLLM : null;
  }

  function setStatus(text){status.textContent=text;}
  function setBusy(value){ask.disabled=value;question.disabled=value;}

  async function waitReady(llm){
    for(var i=0;i<180;i++){
      var r=await llm.getReadiness();
      var value=String(r&&r.readiness||"").toLowerCase();
      if(value.indexOf("ready")>=0||value.indexOf("available")>=0)return value;
      if(value.indexOf("error")>=0||value.indexOf("unavailable")>=0)throw new Error("MODEL_"+value);
      await new Promise(function(resolve){setTimeout(resolve,500);});
    }
    throw new Error("MODEL_READY_TIMEOUT");
  }

  async function ensureReady(){
    if(readyPromise)return readyPromise;
    readyPromise=(async function(){
      var llm=plugin();
      if(!llm)throw new Error("NATIVE_LLM_PLUGIN_UNAVAILABLE");
      await llm.setModel({path:MODEL,modelType:"task",maxTokens:768,topk:32,temperature:0.2,backend:"cpu"});
      await waitReady(llm);
      return llm;
    })().catch(function(error){readyPromise=null;throw error;});
    return readyPromise;
  }

  async function askLocal(){
    var text=question.value.trim();
    if(!text)return;
    setBusy(true);answer.style.display="none";answer.textContent="";
    setStatus("ضاد المحلي يفكر على الهاتف…");
    var listeners=[];
    try{
      var llm=await ensureReady();
      var chat=await llm.createChat();
      var output="";
      var finishedResolve,finishedReject;
      var finished=new Promise(function(resolve,reject){finishedResolve=resolve;finishedReject=reject;});
      listeners.push(await llm.addListener("textFromAi",function(event){
        if(event.chatId===chat.id){output+=event.text||"";answer.textContent=output;answer.style.display="block";}
      }));
      listeners.push(await llm.addListener("aiFinished",function(event){
        if(event.chatId===chat.id)finishedResolve();
      }));
      listeners.push(await llm.addListener("generationError",function(event){
        if(!event.chatId||event.chatId===chat.id)finishedReject(new Error(event.error||"GENERATION_ERROR"));
      }));
      var prompt=[
        "أنت ضاد المحلي، مساعد تعليمي متخصص في اللغة العربية.",
        "تعمل دون إنترنت. أجب بالفصحى الواضحة ولا تدّع تصفح الشبكة.",
        "في النحو والصرف والإملاء والبلاغة اشرح خطوة خطوة.",
        "لا تختلق نصوص كتب أو مناهج رسمية غير معطاة لك.",
        "",
        "سؤال الطالب:",
        text
      ].join("\n");
      await llm.sendMessage({chatId:chat.id,message:prompt});
      await Promise.race([
        finished,
        new Promise(function(_,reject){setTimeout(function(){reject(new Error("GENERATION_TIMEOUT"));},90000);})
      ]);
      if(!output.trim())throw new Error("EMPTY_LOCAL_RESPONSE");
      setStatus("تمت الإجابة محليًا بدون إنترنت ✅");
    }catch(error){
      setStatus("تعذر تشغيل ضاد المحلي على هذا الجهاز الآن. جرّب إعادة الاتصال ثم افتح التطبيق مرة واحدة.");
      console.error("DADYOOM_NATIVE_OFFLINE_ERROR",error);
    }finally{
      for(var i=0;i<listeners.length;i++){try{await listeners[i].remove();}catch(_){}}
      setBusy(false);
    }
  }

  ask.addEventListener("click",function(){void askLocal();});
  retry.addEventListener("click",function(){window.location.href="https://dadyoom.mrahmedsamirhamam.workers.dev/";});

  ensureReady().then(function(){setStatus("ضاد المحلي جاهز داخل الهاتف ✅");}).catch(function(error){
    setStatus("ضاد المحلي مدمج في التطبيق، لكن تعذر تهيئته الآن.");
    console.error("DADYOOM_NATIVE_OFFLINE_BOOT_ERROR",error);
  });
})();
</script>
</body>
</html>
